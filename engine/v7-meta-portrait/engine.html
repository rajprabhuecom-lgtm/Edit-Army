<!doctype html>
<html><head><meta charset="utf-8">
<!-- v7: 9:16 Meta-ad engine (1080x1920), derived from v6. Scenes are laid out at panel width 1080 and shown in the middle band (y 380-1590).
 v6 notes: Built for TM Nutrition 3-Day Family Wellness Challenge VSL.
 Layouts: full = 1920x1080 cutaway; side = animation panel x 0..1152, speaker panel on the right (comp.py);
 face = transparent overlay on the speaker (text / badge / price / cta). Captions: bottom band, or over the speaker panel in side layout. -->
<style>
@font-face{font-family:M;font-weight:900;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-900-normal.woff2)}
@font-face{font-family:M;font-weight:800;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2)}
@font-face{font-family:M;font-weight:700;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-700-normal.woff2)}
@font-face{font-family:T;font-weight:900;src:url(node_modules/@fontsource/noto-sans-tamil/files/noto-sans-tamil-tamil-900-normal.woff2)}
@font-face{font-family:A;src:url(node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2)}
:root{--em:#00C896;--yl:#FFD60A;--rd:#FF3B30;--ob:#080A0D;--ti:#8B949E;--pl:#D8DDE3;--wa:#25D366;--pk:#FF6FA8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;background:transparent;overflow:hidden}
body{font-family:M,'Noto Color Emoji',T,sans-serif;color:#fff}
.layer{position:absolute;inset:0;display:none}
.stroke{paint-order:stroke fill;-webkit-text-stroke:12px #000;text-shadow:0 8px 20px rgba(0,0,0,.55)}
.s8{paint-order:stroke fill;-webkit-text-stroke:8px #000}
#cap{position:absolute;left:50px;right:50px;top:1250px;height:280px;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:0 20px;text-align:center;z-index:10}
#cap span{display:inline-block;font-weight:900;font-size:74px;line-height:1.1;text-transform:uppercase;transform-origin:50% 70%}
#cap.side{top:1600px;height:240px}
#cap.top{top:40px}
.stage{position:absolute;left:0;top:0;height:1920px;overflow:hidden;background:radial-gradient(110% 100% at 40% 30%,#13241e 0%,#0b1411 55%,#080A0D 100%)}
.stage.full,.stage.side{width:1080px}
.inner{position:absolute;inset:0;transform-origin:50% 45%}
.grid{position:absolute;inset:-200px;background-image:linear-gradient(rgba(0,200,150,.07) 2px,transparent 2px),linear-gradient(90deg,rgba(0,200,150,.07) 2px,transparent 2px);background-size:80px 80px}
.glow{position:absolute;width:900px;height:900px;border-radius:50%;left:130px;top:-150px;background:radial-gradient(circle,rgba(0,200,150,.16),transparent 65%)}
.ttl{position:absolute;left:0;right:0;text-align:center;font-weight:900;text-transform:uppercase;line-height:1.04;z-index:4}
.card{position:absolute;background:#0f1713;border:4px solid rgba(0,200,150,.6);border-radius:30px;box-shadow:0 0 60px rgba(0,200,150,.18),0 30px 60px rgba(0,0,0,.5)}
.chip{white-space:nowrap;display:inline-block;padding:10px 28px;border-radius:999px;font-weight:900;font-size:38px}
.g{color:var(--em)}.y{color:var(--yl)}.r{color:var(--rd)}.p{color:var(--pk)}
svg{overflow:visible}
.flash{position:absolute;inset:0;background:#fff;pointer-events:none;z-index:20}
</style></head><body>
<div id="root"></div>
<div id="cap" class="stroke"></div>
<script>
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const easeIO=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=clamp(x);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const pop=(dt,d=.28)=>back(dt/d);
const lerp=(a,b,p)=>a+(b-a)*p;
const root=document.getElementById('root');let TL=null;const els=[];
function mk(html){const d=document.createElement('div');d.className='layer';d.innerHTML=html;root.appendChild(d);return d}
const q=(el,s)=>el.querySelector(s), qa=(el,s)=>[...el.querySelectorAll(s)];
const SD=it=>true;
const PW=it=>1080;                     // portrait: every scene uses the panel layout
function stage(it,inner){return `<div class="stage ${it.layout||'full'}"><div class="inner"><div class="grid"></div><div class="glow"></div>${inner}</div><div class="flash"></div></div>`}
function popIn(x,dt,d=.32){if(!x)return;x.style.opacity=clamp(dt/.06);x.style.transform=`scale(${dt<0?0:pop(dt,d)})`}
function slideUp(x,dt,dist=400,d=.4){if(!x)return;x.style.opacity=clamp(dt/.08);x.style.transform=`translateY(${(1-ease(dt/d))*dist}px)`}
function slideIn(x,dt,dist=500,d=.4){if(!x)return;x.style.opacity=clamp(dt/.08);x.style.transform=`translateX(${(1-ease(dt/d))*dist}px)`}
const cue=(it,i,def)=>((it.cues||[])[i]??def);
const S={};

/* ---------- 1. HOOK: 3 days -> change? -> YES, POSSIBLE ---------- */
S.q3days=(it)=>{const w=PW(it);let pg='';
 [1,2,3].forEach((n,i)=>pg+=`<div class="pg card" style="left:${w/2-390+i*270}px;top:300px;width:240px;height:300px;display:flex;flex-direction:column;align-items:center;overflow:hidden">
  <div style="width:100%;height:70px;background:${i==2?'var(--yl)':'var(--em)'};color:#04110c;font-weight:900;font-size:40px;display:flex;align-items:center;justify-content:center">DAY</div>
  <div style="font-family:A;font-size:170px;line-height:1.25">${n}</div></div>`);
 const el=mk(stage(it,`<div class="ttl stroke t1" style="top:110px;font-size:96px">மூணு நாள்ல <span class="y">CHANGE?</span></div>${pg}
  <div class="qm s8" style="position:absolute;left:${w/2+400}px;top:250px;font-weight:900;font-size:220px;color:var(--rd)">?</div>
  <div class="ys" style="position:absolute;left:0;width:${w}px;top:680px;text-align:center"><span class="chip s8" style="background:var(--em);color:#04110c;font-size:92px;padding:18px 60px;border:8px solid #fff">YES ✓ POSSIBLE</span></div>`));
 return {el,upd(dt){popIn(q(el,'.t1'),dt);qa(el,'.pg').forEach((x,i)=>{const t=dt-cue(it,0,.3)-i*.25;x.style.opacity=clamp(t/.06);x.style.transform=`rotateY(${(1-ease(t/.35))*90}deg) translateY(${(1-ease(t/.35))*80}px)`});
  const m=q(el,'.qm');const tq=dt-cue(it,1,1.2);m.style.opacity=clamp(tq/.05);m.style.transform=`scale(${tq<0?0:pop(tq,.3)}) rotate(${Math.sin(dt*6)*10}deg)`;
  const y=q(el,'.ys');const ty=dt-cue(it,2,2.4);y.style.opacity=clamp(ty/.05);y.style.transform=`scale(${ty<0?0:lerp(2.2,1,ease(ty/.2))}) rotate(-4deg)`;if(ty>0)m.style.opacity=clamp(1-ty/.2)}}};

/* ---------- HOOK: "how many times have you both decided to lose weight?" - plans crossed out again and again ---------- */
S.tally=(it)=>{const w=PW(it);let c='';const L=it.labels||['DIET START','WALKING','NO SUGAR','GYM','DIET START','NO RICE'];
 L.forEach((l,i)=>c+=`<div class="tc card" style="left:${w/2-330+(i%3)*230}px;top:${300+Math.floor(i/3)*200}px;width:200px;height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-color:#2b3a35">
  <div style="font-size:60px">📅</div><div style="font-weight:900;font-size:24px;margin-top:6px;white-space:nowrap">${l}</div>
  <div class="xk s8" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:150px;color:var(--rd)">✗</div></div>`);
 const el=mk(stage(it,`<div class="ttl stroke t1" style="top:110px;width:${w}px;font-size:${SD(it)?64:84}px">👫 எத்தனை <span class="r">தடவை?</span></div>${c}`));
 return {el,upd(dt){popIn(q(el,'.t1'),dt);qa(el,'.tc').forEach((x,i)=>{const t=dt-.25-i*.42;x.style.opacity=clamp(t/.06);x.style.transform=`scale(${t<0?0:pop(t,.28)})`;
  const k=q(x,'.xk');const tk=t-.22;k.style.opacity=clamp(tk/.04);k.style.transform=`scale(${tk<0?0:lerp(2.2,1,ease(tk/.15))}) rotate(-8deg)`})}}};

/* ---------- PAIN beats (one scene, four variants): diet->biryani, gym, midnight mobile, "tomorrow" ---------- */
S.pain=(it)=>{const w=PW(it),cx=w/2;let body='',ttl='';const v=it.v;
 if(v=='diet'){ttl='3 நாள் <span class="g">DIET</span>...';
  body=[1,2,3].map(i=>`<div class="dc card" style="left:${cx-360+(i-1)*250}px;top:300px;width:220px;height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center"><div style="font-size:100px">🥗</div><div style="font-weight:900;font-size:34px;color:var(--em)">DAY ${i}</div></div>`).join('')+
  `<div class="bg" style="position:absolute;left:0;width:${w}px;top:560px;text-align:center;font-size:200px;line-height:1">🍛</div><div class="bl" style="position:absolute;left:0;width:${w}px;top:790px;text-align:center"><span class="chip s8" style="background:var(--rd);font-size:60px;padding:12px 44px">அப்புறம் BIRYANI!</span></div>`}
 if(v=='gym'){ttl='🏋️ GYM <span class="y">MEMBERSHIP</span>';
  body=`<div class="pd" style="position:absolute;left:0;width:${w}px;top:220px;text-align:center"><span class="chip" style="background:var(--em);color:#04110c;font-size:44px">💳 PAID ✓</span></div>`+
  Array.from({length:14},(_,i)=>`<div class="gd" style="position:absolute;left:${cx-455+(i%7)*130}px;top:${340+Math.floor(i/7)*150}px;width:110px;height:120px;border-radius:20px;background:#0f1713;border:4px solid #2b3a35;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900"><div style="font-size:24px;color:var(--ti)">DAY ${i+1}</div><div class="mk" style="font-size:52px"></div></div>`).join('')+
  `<div class="bl" style="position:absolute;left:0;width:${w}px;top:690px;text-align:center"><span class="chip s8" style="background:var(--rd);font-size:54px;padding:12px 40px">2 வாரம் கூட இல்ல ❌</span></div>`}
 if(v=='midnight'){ttl='🌙 ராத்திரி <span class="y">12 மணி</span> வரை';
  body=`<svg class="ck" style="position:absolute;left:${cx-440}px;top:250px" width="420" height="420" viewBox="0 0 420 420"><circle cx="210" cy="210" r="190" fill="#0f1713" stroke="#FFD60A" stroke-width="14"/>
   ${Array.from({length:12},(_,i)=>`<line x1="210" y1="35" x2="210" y2="${i%3?58:75}" stroke="#D8DDE3" stroke-width="${i%3?5:10}" transform="rotate(${i*30} 210 210)"/>`).join('')}
   <line class="hh" x1="210" y1="210" x2="210" y2="110" stroke="#fff" stroke-width="16" stroke-linecap="round"/><line class="mh" x1="210" y1="210" x2="210" y2="60" stroke="#FFD60A" stroke-width="10" stroke-linecap="round"/><circle cx="210" cy="210" r="16" fill="#fff"/></svg>
   <div class="ps" style="position:absolute;left:${cx+30}px;top:260px;display:flex;gap:40px">${['🧔','👩'].map(e=>`<div class="pp" style="display:flex;flex-direction:column;align-items:center"><div style="font-size:110px">${e}</div><div class="phn" style="width:120px;height:200px;border-radius:22px;border:7px solid #D8DDE3;background:#20406a;box-shadow:0 0 60px rgba(90,160,255,.7);display:flex;align-items:center;justify-content:center;font-size:56px">📱</div></div>`).join('')}</div>
   <div class="bl" style="position:absolute;left:0;width:${w}px;top:740px;text-align:center"><span class="chip s8" style="background:var(--rd);font-size:54px;padding:12px 40px">கையில MOBILE 📱</span></div>`}
 if(v=='tomorrow'){ttl='"<span class="y">நாளைக்கு</span> ஆரம்பிக்கலாம்"';
  body=`<div class="cal card" style="left:${cx-200}px;top:250px;width:400px;height:420px;overflow:hidden"><div style="height:100px;background:var(--rd);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:46px">TOMORROW</div>
   <div class="dn" style="font-family:A;font-size:240px;text-align:center;line-height:1.3">1</div></div>
   <div class="pp2" style="position:absolute;left:${cx-470}px;top:330px;font-size:150px">🧔</div><div class="pp3" style="position:absolute;left:${cx+270}px;top:330px;font-size:150px">👩</div>
   <div class="bl" style="position:absolute;left:0;width:${w}px;top:740px;text-align:center"><span class="chip s8" style="background:var(--yl);color:#000;font-size:50px;padding:12px 40px">😅 நாளைக்கு... நாளைக்கு...</span></div>`}
 const el=mk(stage(it,`<div class="ttl stroke t1" style="top:90px;width:${w}px;font-size:${SD(it)?52:84}px">${ttl}</div>${body}`));
 const c1=cue(it,0,1.2);
 return {el,upd(dt){popIn(q(el,'.t1'),dt);
  if(v=='diet'){qa(el,'.dc').forEach((x,i)=>{const t=dt-.2-i*.3;x.style.opacity=clamp(t/.06);x.style.transform=`translateY(${(1-ease(t/.3))*200}px)`;x.style.filter=dt>c1?'grayscale(1) brightness(.5)':'none'});
   const b=q(el,'.bg');const t=dt-c1;b.style.opacity=clamp(t/.05);b.style.transform=`translateY(${t<0?-600:(1-ease(t/.25))*-600}px) scale(${1+.06*Math.sin(dt*9)})`;popIn(q(el,'.bl'),t-.2)}
  if(v=='gym'){popIn(q(el,'.pd'),dt-.2);qa(el,'.gd').forEach((x,i)=>{const t=dt-.4-i*.06;x.style.opacity=clamp(t/.06);const att=i<4;const m=q(x,'.mk');const tm=dt-.9-i*.12;
    if(tm>0){m.textContent=att?'✅':'✗';m.style.color=att?'':'#FF3B30';x.style.borderColor=att?'#00C896':'#5a2a2a'}});popIn(q(el,'.bl'),dt-c1-.6)}
  if(v=='midnight'){const ck=q(el,'.ck');ck.style.transform=`scale(${pop(dt-.1,.35)})`;ck.style.transformOrigin='210px 210px';const p=ease((dt-.2)/1.4);
   q(el,'.mh').setAttribute('transform',`rotate(${p*360*4} 210 210)`);q(el,'.hh').setAttribute('transform',`rotate(${270+p*90} 210 210)`);
   qa(el,'.pp').forEach((x,i)=>{const t=dt-.4-i*.2;x.style.opacity=clamp(t/.06);x.style.transform=`translateY(${(1-ease(t/.3))*200}px)`});qa(el,'.phn').forEach((x,i)=>x.style.boxShadow=`0 0 ${50+20*Math.sin(dt*6+i)}px rgba(90,160,255,.75)`);popIn(q(el,'.bl'),dt-c1)}
  if(v=='tomorrow'){slideUp(q(el,'.cal'),dt,300);const n=Math.floor(Math.max(0,dt-.4)/.6);q(el,'.dn').textContent=['MON','TUE','WED','THU','FRI','SAT'][n%6];
   q(el,'.dn').style.fontSize='150px';q(el,'.dn').style.paddingTop='50px';q(el,'.dn').style.transform=`rotateX(${(1-ease(((dt-.4)%.6)/.25))*80}deg)`;
   ['.pp2','.pp3'].forEach((s,i)=>{const x=q(el,s);x.style.opacity=clamp((dt-.2)/.1);x.style.transform=`rotate(${Math.sin(dt*3+i*2)*8}deg)`});popIn(q(el,'.bl'),dt-c1)}}}};

/* ---------- "problem is not willpower - it is your home's pattern" ---------- */
S.pattern=(it)=>{const w=PW(it),cx=w/2;
 const el=mk(stage(it,`<div class="wp" style="position:absolute;left:${cx-(SD(it)?520:640)}px;top:230px;width:${SD(it)?440:520}px;height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center">
   <div style="font-size:130px">💪</div><div style="font-weight:900;font-size:60px">WILL POWER</div>
   <div class="x1" style="position:absolute;left:-20px;right:-20px;top:150px;height:16px;border-radius:8px;background:var(--rd);transform-origin:0 50%"></div>
   <div class="x2 chip" style="position:absolute;top:0;right:0;background:var(--rd);font-size:34px">PROBLEM இல்ல</div></div>
  <div class="hm" style="position:absolute;left:${cx+(SD(it)?20:60)}px;top:180px;width:${SD(it)?500:560}px;height:480px">
   <svg width="100%" height="100%" viewBox="0 0 500 480"><path d="M60 230 L250 70 L440 230 L440 450 L60 450 Z" fill="#0f1713" stroke="#FFD60A" stroke-width="12" stroke-linejoin="round"/>
    <g class="lp" style="transform-origin:250px 330px"><path d="M170 330 A80 80 0 1 1 250 410" fill="none" stroke="#FF3B30" stroke-width="14" stroke-linecap="round"/><path d="M250 410 l-26 -14 l6 30 z" fill="#FF3B30"/></g>
    <text x="250" y="345" text-anchor="middle" font-size="44" font-weight="900" fill="#fff" font-family="M">🔁</text></svg>
   <div class="pl" style="position:absolute;left:0;right:0;top:-20px;text-align:center"><span class="chip" style="background:var(--yl);color:#000;font-size:44px">🏠 வீட்டோட PATTERN</span></div></div>
  <div class="ft" style="position:absolute;left:0;width:${w}px;top:760px;text-align:center"><span class="chip s8" style="background:var(--em);color:#04110c;font-size:54px;padding:12px 44px">✓ PROBLEM = PATTERN</span></div>`));
 const c1=cue(it,0,.9),c2=cue(it,1,2.0);
 return {el,upd(dt){popIn(q(el,'.wp'),dt-.1);const x=q(el,'.x1');x.style.transform=`scaleX(${ease((dt-c1)/.25)})`;popIn(q(el,'.x2'),dt-c1-.15);q(el,'.wp').style.filter=dt>c1+.2?'grayscale(.8) brightness(.6)':'none';
  slideUp(q(el,'.hm'),dt-c2,300);q(el,'.lp').style.transform=`rotate(${dt*160}deg)`;popIn(q(el,'.pl'),dt-c2-.2);popIn(q(el,'.ft'),dt-c2-.8)}}};

/* ---------- guarantee stamp (on the face) ---------- */
S.stamp=(it)=>{const el=mk(`<div class="sp" style="position:absolute;left:${it.x??110}px;top:${it.y??200}px;width:560px;height:560px;border-radius:50%;border:16px double var(--em);display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(4,17,12,.82);box-shadow:0 30px 70px rgba(0,0,0,.6)">
  <div style="font-family:A;font-size:150px;color:var(--em);line-height:1">100%</div><div style="font-weight:900;font-size:58px;letter-spacing:2px">MONEY BACK</div>
  <div style="margin-top:10px;font-weight:800;font-size:28px;color:var(--pl);text-align:center;padding:0 60px;line-height:1.2">${it.sub||'3 நாள் LIVE • VALUE இல்லைன்னா'}</div></div>
  ${it.badge?`<div class="rb" style="position:absolute;left:${(it.x??110)-10}px;width:580px;top:${(it.y??200)+590}px;text-align:center"><span class="chip" style="background:var(--yl);color:#000;font-size:38px">${it.badge}</span></div>`:''}`);
 return {el,upd(dt){const s=q(el,'.sp');s.style.opacity=clamp(dt/.05);s.style.transform=`scale(${dt<0?0:lerp(2.4,1,ease(dt/.2))}) rotate(-10deg)`;const r=q(el,'.rb');if(r)popIn(r,dt-(it.bt??1.0))}}};

/* ---------- 2. 3 days + bonus overview (agenda) ---------- */
S.agenda=(it)=>{const w=PW(it);const D=it.days||[['DAY 1','📱','HABITS'],['DAY 2','👨‍👩‍👧‍👦','FAMILY HEALTH'],['DAY 3','🏡','FAMILY HAPPINESS'],['BONUS','💰','FINANCIAL LITERACY']];
 const n=D.length,cw=SD(it)?250:360,gap=SD(it)?22:40,x0=(w-(n*cw+(n-1)*gap))/2;let c='';
 D.forEach((d,i)=>{const b=i==n-1&&d[0]=='BONUS';c+=`<div class="dy card" style="left:${x0+i*(cw+gap)}px;top:330px;width:${cw}px;height:400px;display:flex;flex-direction:column;align-items:center;justify-content:center;${b?'border-color:#FFD60A;box-shadow:0 0 70px rgba(255,214,10,.3)':''}">
  <div style="font-weight:900;font-size:${SD(it)?44:54}px;color:${b?'#FFD60A':'#00C896'}">${d[0]}</div><div style="font-size:${SD(it)?100:130}px;margin:14px 0">${d[1]}</div><div style="font-weight:900;font-size:${SD(it)?30:38}px;text-align:center;padding:0 10px;line-height:1.1">${d[2]}</div></div>`});
 const el=mk(stage(it,`<div class="ttl stroke t1" style="top:110px;width:${w}px;font-size:${SD(it)?60:76}px">${it.title||'3 நாள் <span class="y">FAMILY WELLNESS</span> CHALLENGE'}</div>${c}
  ${it.foot?`<div class="ft" style="position:absolute;left:0;width:${w}px;top:790px;text-align:center"><span class="chip" style="background:var(--em);color:#04110c;font-size:42px">${it.foot}</span></div>`:''}`));
 return {el,upd(dt){popIn(q(el,'.t1'),dt);qa(el,'.dy').forEach((x,i)=>{const t=dt-cue(it,i,.3+i*.3);x.style.opacity=clamp(t/.1);x.style.transform=`translateY(${(1-ease(t/.35))*140}px) scale(${t<0?0:pop(t,.35)})`;
   const on=it.focus!=null?(i==it.focus):true;x.style.filter=on?'none':'brightness(.45) saturate(.4)'});popIn(q(el,'.ft'),dt-(it.ftc||1.8))}}};

/* ---------- 3. DAY 1: mobile scrolling -> habits tuned (hand-hold) ---------- */
