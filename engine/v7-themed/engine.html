<!doctype html>
<html><head><meta charset="utf-8">
<!-- Overlay engine v7 "themed": v6 scenes + new generic scenes; every colour, font, motif and brand text comes from the
     client's theme.css (copied next to this file) and timeline.brand. One look per client, one engine.
     API: init(timeline) then setT(seconds) -> true when the frame has any overlay. -->
<link rel="stylesheet" href="theme.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;background:transparent;overflow:hidden}
body{font-family:JS,'Noto Color Emoji',CT,sans-serif;color:#fff}
.L{position:absolute;inset:0;display:none}
.gold{background:var(--goldtxt);-webkit-background-clip:text;background-clip:text;color:transparent}
.emo{font-family:'Noto Color Emoji';font-style:normal}
/* ---------- captions: two-line, lead-in + gold serif keyword ---------- */
#cap{position:absolute;left:30px;right:30px;top:1180px;height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20}
#cap::before{content:"";position:absolute;left:-20px;right:-20px;top:-10px;bottom:-10px;background:radial-gradient(50% 50% at 50% 55%,color-mix(in srgb,var(--d0) 78%,transparent) 0%,color-mix(in srgb,var(--d0) 45%,transparent) 55%,color-mix(in srgb,var(--d0) 0%,transparent) 100%);z-index:-1}
#cap.split{top:652px;height:210px}
#cap .lead{font-family:JS;font-weight:700;font-size:40px;letter-spacing:6px;color:#fff;text-shadow:0 3px 12px rgba(0,0,0,.8);display:flex;align-items:center;gap:18px;white-space:nowrap}
#cap .lead i{font-style:normal;color:var(--lg);font-size:26px}
#cap .kw{font-family:PF;font-weight:900;font-style:italic;line-height:1.08;white-space:nowrap;padding:0 14px 10px;
 background:linear-gradient(100deg,rgba(255,255,255,0) 42%,rgba(255,255,255,.95) 50%,rgba(255,255,255,0) 58%),var(--goldtxt);
 background-size:260% 100%,100% 100%;background-repeat:no-repeat;-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 6px 10px color-mix(in srgb,var(--sh) 85%,transparent)) drop-shadow(0 0 2px color-mix(in srgb,var(--sh) 90%,transparent))}
#cap.split .lead{font-size:34px;letter-spacing:5px}
#cap.B{flex-direction:column-reverse}
#cap.B .kw{font-style:normal;text-transform:uppercase;letter-spacing:1px;padding-bottom:4px}
#cap.B .lead{font-weight:600;font-size:40px;letter-spacing:1px;margin-top:-2px}
#cap.B.split .lead{font-size:34px}
/* ---------- brand: top badge + lower third ---------- */
#tb{position:absolute;right:36px;top:150px;padding:12px 30px 14px 26px;border-radius:40px;border:2px solid var(--g);
 background:linear-gradient(135deg,color-mix(in srgb,var(--d2) 95%,transparent),color-mix(in srgb,var(--d0) 95%,transparent));box-shadow:0 6px 26px rgba(0,0,0,.45),0 0 18px color-mix(in srgb,var(--a2) 35%,transparent);display:flex;align-items:center;gap:10px;z-index:30}
#tb span{font-family:PF;font-weight:900;font-style:italic;font-size:38px}
#tb b{font-size:34px;color:var(--lg);display:inline-block;text-shadow:0 0 12px var(--a1)}
#lt{position:absolute;left:44px;top:1556px;padding:14px 34px 16px 30px;border-left:8px solid var(--g);border-radius:0 18px 18px 0;
 background:linear-gradient(90deg,color-mix(in srgb,var(--d1) 96%,transparent),color-mix(in srgb,var(--d1) 86%,transparent));box-shadow:0 8px 30px rgba(0,0,0,.45);z-index:30}
#lt .n{font-family:PF;font-weight:900;font-size:50px;line-height:1.05}
#lt .t{font-family:JS;font-weight:600;font-size:23px;letter-spacing:2.2px;color:var(--sg);margin-top:4px}
/* ---------- split frame ---------- */
#sline{position:absolute;left:0;right:0;top:856px;height:8px;background:linear-gradient(90deg,var(--a3),var(--a1) 30%,var(--a0) 50%,var(--a1) 70%,var(--a3));box-shadow:0 0 24px color-mix(in srgb,var(--a1) 75%,transparent),0 8px 30px rgba(0,0,0,.6);z-index:15}
#sweep{position:absolute;left:0;top:0;width:1080px;height:864px;overflow:hidden;z-index:14;pointer-events:none}
#sweep div{position:absolute;top:-300px;width:260px;height:1500px;transform:rotate(18deg);background:linear-gradient(90deg,color-mix(in srgb,var(--a0) 0%,transparent),color-mix(in srgb,var(--a0) 85%,transparent),color-mix(in srgb,var(--a0) 0%,transparent))}
#chip{position:absolute;left:40px;top:236px;padding:10px 24px 8px;border-radius:30px;background:color-mix(in srgb,var(--d1) 90%,transparent);border:2px solid var(--g);font-family:JS;font-weight:700;font-size:30px;letter-spacing:3px;color:var(--sg);z-index:16}
/* ---------- scene stage ---------- */
.stage{position:absolute;left:0;top:0;width:1080px;height:864px;overflow:hidden;
 background:radial-gradient(120% 90% at 50% 30%,var(--d2) 0%,var(--d1) 45%,var(--d0) 100%)}
.stage.full{height:1920px}
.stage.full .mand{top:820px}
.stage .mand{position:absolute;left:50%;top:440px;width:1100px;height:1100px;margin:-550px 0 0 -550px;opacity:.16}
.dust{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--a0);box-shadow:0 0 10px var(--a1)}
.hdr{position:absolute;left:0;right:0;top:236px;text-align:center;font-family:PF;font-weight:900;font-style:italic;font-size:46px}
.card{position:absolute;border-radius:22px;border:2px solid color-mix(in srgb,var(--a2) 90%,transparent);background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
 box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 0 20px color-mix(in srgb,var(--a1) 12%,transparent);display:flex;align-items:center;gap:20px;padding:0 26px}
.card .e{font-size:58px;font-family:'Noto Color Emoji'}
.card .x{font-family:JS;font-weight:700;font-size:34px;letter-spacing:1.5px;color:var(--sg);flex:1}
.tick{width:52px;height:52px;border-radius:50%;background:linear-gradient(180deg,var(--a1),var(--a2));color:var(--d1);font-weight:700;font-size:34px;display:flex;align-items:center;justify-content:center;font-family:JS}
.seal{position:absolute;left:50%;transform:translateX(-50%);font-family:PF;font-weight:900;font-style:italic;white-space:nowrap}
/* cta */
.btn{position:absolute;left:50%;width:660px;height:124px;margin-left:-330px;border-radius:70px;background:linear-gradient(180deg,var(--b1),var(--b2) 55%,var(--b3));
 border:3px solid var(--a1);box-shadow:0 12px 34px rgba(0,0,0,.5),0 0 0 0 color-mix(in srgb,var(--a1) 60%,transparent);display:flex;align-items:center;justify-content:center;gap:22px;z-index:25}
.btn span{font-family:JS;font-weight:700;font-size:54px;letter-spacing:4px;color:#fff;text-shadow:0 3px 8px rgba(0,0,0,.35);padding-top:6px}
.btn .ar{font-family:JS;font-size:54px;color:#fff}
.ring{position:absolute;inset:-3px;border-radius:70px;border:4px solid var(--a1)}
.hand{position:absolute;font-family:'Noto Color Emoji';font-size:86px;z-index:26}
.tslam{position:absolute;left:50%;transform:translateX(-50%);padding:18px 44px 14px;border-radius:24px;background:color-mix(in srgb,var(--d0) 88%,transparent);border:3px solid var(--g);
 font-family:CT;font-weight:900;font-size:66px;line-height:1.2;text-align:center;color:#fff;white-space:nowrap;box-shadow:0 12px 34px rgba(0,0,0,.5)}
.tslam b{color:var(--a1);font-family:CT}
.pill{position:absolute;left:50%;transform:translateX(-50%);padding:16px 40px 12px;border-radius:40px;background:linear-gradient(180deg,var(--a0),var(--a2) 55%,var(--a2));
 color:var(--d1);font-family:JS;font-weight:700;font-size:34px;letter-spacing:3px;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.pill i{font-style:normal;opacity:.6}
</style></head>
<body>
<div id="root"></div>
<script>
const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3), eb=x=>{x=Math.max(0,Math.min(1,x));const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)}, cl=x=>Math.max(0,Math.min(1,x));
const R=document.getElementById('root'); let B={star:'✦',motif:'mandala'},STAR='✦'; let TL, ITEMS=[], CAPS=[], CAPEL, BRAND={}, SPL={};
function el(tag,cls,html,parent){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;(parent||R).appendChild(e);return e}
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}
function mandala(parent,cls){const n=24;let s=`<svg viewBox="-100 -100 200 200" class="${cls||'mand'}" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="var(--a1)" stroke-width=".6">`;
 for(let i=0;i<n;i++)s+=`<ellipse cx="0" cy="-52" rx="9" ry="34" transform="rotate(${i*360/n})"/>`;
 for(let i=0;i<n;i++)s+=`<ellipse cx="0" cy="-78" rx="5" ry="16" transform="rotate(${i*360/n+7.5})"/>`;
 s+=`<circle r="20"/><circle r="26"/><circle r="94"/><circle r="97"/></g></svg>`;const d=el('div',null,s,parent);return d.firstChild}
function dust(parent,n,h){const a=[];for(let i=0;i<n;i++){const d=el('div','dust',null,parent);a.push(d)}return (t)=>a.forEach((d,i)=>{const x=rnd(i)*1080,y=(rnd(i+50)*h - t*(20+rnd(i+9)*40))%h;
 d.style.left=x+'px';d.style.top=(y<0?y+h:y)+'px';d.style.opacity=(0.25+0.75*Math.abs(Math.sin(t*1.8+i)))*0.8;const s=0.5+rnd(i+3)*1.1;d.style.transform=`scale(${s})`})}
function motif(s){if(B.motif==='grid'){const n=12;let g=`<svg viewBox="0 0 200 200" class="mand" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="var(--a1)" stroke-width=".5">`;
  for(let i=0;i<=n;i++){const p=i*200/n;g+=`<line x1="${p}" y1="0" x2="${p}" y2="200"/><line x1="0" y1="${p}" x2="200" y2="${p}"/>`}
  g+=`<rect x="66" y="66" width="68" height="68" stroke-width="1.6"/></g><g fill="var(--a1)">`;for(let i=0;i<=n;i+=2)for(let j=0;j<=n;j+=2)g+=`<circle cx="${i*200/n}" cy="${j*200/n}" r="1.4"/>`;
  g+=`</g></svg>`;const d=el('div',null,g,s);return d.firstChild}
 if(B.motif==='rings'){let g=`<svg viewBox="-100 -100 200 200" class="mand" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="var(--a1)">`;
  for(let i=1;i<=7;i++)g+=`<circle r="${i*13}" stroke-width="${i%2?1.2:.5}" stroke-dasharray="${i%2?'':'3 4'}"/>`;
  for(let i=0;i<12;i++)g+=`<path d="M0 -14 Q 10 -50 0 -92" transform="rotate(${i*30})" stroke-width=".6"/>`;g+=`</g></svg>`;const d=el('div',null,g,s);return d.firstChild}
 return mandala(s)}
let CURFULL=false;
function stage(full){full=full||CURFULL;const s=el('div','stage'+(full?' full':''));const m=motif(s);const dz=dust(s,34,full?1920:864);return {s,m,dz}}
function show(e,v){e.style.display=v?'block':'none'}
/* ================= scenes ================= */
const SC={};
SC.rush=(it)=>{const st=stage();const h=el('div','hdr gold','Every Day, For Everyone',st.s);
 const data=[['☕','HIS COFFEE',90,300],['🍱',"KIDS' TIFFIN",560,300],['👵','FAMILY CARE',90,412],['🧺','HOUSEWORK',560,412]];
 const cards=data.map(([e,x,l,t])=>{const c=el('div','card',`<span class="e">${e}</span><span class="x">${x}</span><span class="tick">✓</span>`,st.s);Object.assign(c.style,{left:l+'px',top:t+'px',width:'430px',height:'96px'});return c});
 const you=el('div','card',`<span class="e">🌸</span><span class="x" style="font-family:PF;font-style:italic;font-weight:900;font-size:50px;color:var(--painl)">And You?</span><span class="tick" style="background:none;border:3px dashed var(--pain);color:var(--pain)">?</span>`,st.s);
 Object.assign(you.style,{left:'260px',top:'528px',width:'560px',height:'104px',borderColor:'var(--pain)',boxShadow:'0 0 34px color-mix(in srgb,var(--pain) 45%,transparent)'});
 return {root:st.s,set(lt){st.m.style.transform=`rotate(${lt*8}deg)`;st.dz(lt);h.style.opacity=ease(lt/.3);
  cards.forEach((c,i)=>{const p=eb((lt-it.cues[i])/.35);c.style.opacity=cl((lt-it.cues[i])/.15);c.style.transform=`translateY(${(1-p)*40}px) scale(${.9+.1*p})`;
   const tk=c.querySelector('.tick');const q=eb((lt-it.cues[i]-.25)/.3);tk.style.transform=`scale(${q})`;
   if(lt>it.cues[4]){c.style.opacity=.55}});
  const p=eb((lt-it.cues[4])/.4);you.style.opacity=cl((lt-it.cues[4])/.15);you.style.transform=`scale(${.7+.3*p}) rotate(${Math.sin(lt*14)*1.5*cl((lt-it.cues[4])/.3)}deg)`}}};
SC.dreamcloud=(it)=>{const st=stage();const h=el('div','hdr gold','✦ Your Dream ✦',st.s);
 const cl_=el('div',null,`<svg width="820" height="380" viewBox="0 0 820 380"><path d="M150 330 C60 330 40 240 110 210 C80 130 180 80 250 115 C280 40 400 20 450 85 C510 30 640 50 650 130 C750 130 790 230 720 280 C740 330 680 350 630 330 Z" fill="color-mix(in srgb,var(--soft) 13%,transparent)" stroke="var(--a1)" stroke-width="5" style="filter:drop-shadow(0 0 14px color-mix(in srgb,var(--a1) 80%,transparent))"/></svg>`,st.s);

 const bub=[[150,640,22],[205,606,30],[262,575,0]].slice(0,2).map(([x,y,r])=>{const b=el('div',null,null,st.s);Object.assign(b.style,{position:'absolute',left:x-r+'px',top:y-r+'px',width:2*r+'px',height:2*r+'px',borderRadius:'50%',border:'4px solid var(--a1)',background:'color-mix(in srgb,var(--soft) 13%,transparent)'});return b});
 const ic=[['💼','OWN OFFICE',300],['🚗','CAR',540],['🏡','HOME',780]].map(([e,l,x])=>{const d=el('div',null,`<div class="emo" style="font-size:108px;line-height:1">${e}</div><div style="font-family:JS;font-weight:700;font-size:26px;letter-spacing:3px;color:var(--soft);margin-top:6px">${l}</div>`,st.s);

 return {root:st.s,set(lt){st.m.style.transform=`rotate(${lt*8}deg)`;st.dz(lt);h.style.opacity=ease(lt/.3);
  bub.forEach((b,i)=>{const p=eb((lt-i*.12)/.3);b.style.transform=`scale(${p})`});

  ic.forEach((d,i)=>{const q=eb((lt-it.cues[i+1>3?3:i+1]+.1)/.35);d.style.opacity=cl(q*1.5);d.style.transform=`scale(${.4+.6*q}) translateY(${Math.sin(lt*2.4+i)*5}px)`})}}};
SC.careers=(it)=>{const st=stage();const h=el('div','hdr gold','✦ Your Right Career ✦',st.s);

 Object.assign(c.style,{position:'absolute',left:'400px',top:'330px',width:'280px',height:'280px',borderRadius:'50%',border:'5px solid var(--a1)',background:'radial-gradient(circle,var(--d2),var(--d1))',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 0 50px color-mix(in srgb,var(--a1) 55%,transparent)'});
 const orb=['💻','💡','🏆','📈'].map(e=>{const d=el('div','emo',e,st.s);Object.assign(d.style,{position:'absolute',fontSize:'84px',width:'110px',height:'110px',lineHeight:'110px',textAlign:'center',borderRadius:'50%',background:'color-mix(in srgb,var(--soft) 12%,transparent)',border:'3px solid color-mix(in srgb,var(--a1) 85%,transparent)'});return d});
 return {root:st.s,set(lt){st.m.style.transform=`rotate(${lt*8}deg)`;st.dz(lt);h.style.opacity=ease(lt/.3);c.style.transform=`scale(${eb(lt/.4)})`;
  orb.forEach((d,i)=>{const a=(i*90+lt*55)*Math.PI/180,p=eb((lt-.15-i*.12)/.35);const x=540+Math.cos(a)*350*p,y=470+Math.sin(a)*135*p;

SC.dreams=(it)=>{const st=stage();const h=el('div','hdr gold','✦ Your Dreams ✦',st.s);
 const data=[['💰','Money','பணம்',90,300],['🚗','Car','கார்',560,300],['💼','Career','கரியர்',90,470],['🏡','Own Home','சொந்த வீடு',560,470]];

 Object.assign(fr.style,{position:'absolute',left:'70px',right:'70px',top:'224px',height:'410px',border:'3px solid var(--a2)',outline:'2px solid color-mix(in srgb,var(--a2) 50%,transparent)',outlineOffset:'8px',borderRadius:'16px',textAlign:'center',paddingTop:'26px',background:'color-mix(in srgb,var(--d0) 35%,transparent)'});

 const c=el('div',null,`${E.img?`<img src="${E.img}" style="width:${E.imgw||560}px;border-radius:18px;border:4px solid var(--a1);box-shadow:0 20px 50px rgba(0,0,0,.5);margin-bottom:34px">`:''}<div style="font-family:JS;font-weight:700;font-size:32px;letter-spacing:6px;color:var(--soft)">${E.top}</div>
  <div class="gold" style="font-family:PF;font-weight:900;font-size:${E.size||170}px;line-height:1;margin-top:40px">${E.main}</div>
  <div class="gold" style="font-family:PF;font-weight:900;font-style:italic;font-size:${E.size2||160}px;line-height:1.02">${E.main2}</div>
  <div style="font-family:PF;font-weight:800;font-style:italic;font-size:56px;color:var(--soft);margin-top:40px">${E.by}</div>
  <div style="font-family:JS;font-weight:600;font-size:25px;letter-spacing:2.5px;color:var(--soft);margin-top:8px">${E.title}</div>`,st.s);
 Object.assign(c.style,{position:'absolute',left:0,right:0,top:(E.top_y||470)+'px',textAlign:'center'});
 const cta=GF.cta({label:E.btn,y:E.btn_y||1300});st.s.appendChild(cta.root);cta.root.style.display='block';
 return {root:st.s,set(lt){st.m.style.transform=`rotate(${lt*10}deg)`;st.dz(lt);const p=eb(lt/.5);c.style.opacity=cl(lt/.2);c.style.transform=`scale(${.85+.15*p})`;cta.set(Math.max(0,lt-.15))}}};
/* ================= engine ================= */
function init(tl){TL=tl;B=Object.assign({badge:'',name:'',title:'',star:'✦',motif:'mandala'},tl.brand||{});STAR=B.star;
 for(const it of tl.items){let o=null;
  if(it.type==='vid'){o=null}
  else if(SC[it.type]){CURFULL=it.layout==='full';o=SC[it.type](it);CURFULL=false;
   if(it.layout==='full'){const wr=document.createElement('div');Object.assign(wr.style,{position:'absolute',left:0,top:0,width:'1080px',height:'864px',transformOrigin:'540px 432px',transform:'translateY(395px) scale(1.1)'});
    [...o.root.children].filter(c=>!c.classList.contains('mand')&&!c.classList.contains('dust')).forEach(c=>wr.appendChild(c));o.root.appendChild(wr)}}
  else if(GF[it.type]){o=GF[it.type](it)}
  if(o){[o.root,o.extra].forEach(x=>{if(x){x.style.display='none';if(!x.classList.contains('L')&&!x.classList.contains('stage')){}}})}
  ITEMS.push({it,o})}
 // split frame pieces
 SPL.line=el('div',null,null);SPL.line.id='sline';SPL.sw=el('div',null,'<div></div>');SPL.sw.id='sweep';SPL.chip=el('div',null,'');SPL.chip.id='chip';
 // brand
 BRAND.tb=el('div',null,`<span class="gold">${B.badge}</span><b>${STAR}</b>`);BRAND.tb.id='tb';
 BRAND.lt=el('div',null,`<div class="n gold">${B.name}</div><div class="t">${B.title}</div>`);BRAND.lt.id='lt';
 CAPEL=el('div',null,'<div class="lead"></div><div class="kw"></div>');CAPEL.id='cap';
 for(const x of [SPL.line,SPL.sw,SPL.chip,BRAND.tb,BRAND.lt,CAPEL])x.style.display='none';
 const ec=ITEMS.find(x=>x.it.type==='endcard');if(ec)R.appendChild(ec.o.root);
 return true}
let lastCap=-1;
function fitKw(kw,max,maxw){let s=max;kw.style.fontSize=s+'px';while(kw.scrollWidth>maxw&&s>48){s-=4;kw.style.fontSize=s+'px'}}
function setT(t){let any=false,split=null,endOn=false;
 for(const {it,o} of ITEMS){const on=t>=it.t0&&t<it.t1;
  if(it.layout&&on)split=it;
  if(it.type==='endcard'&&on)endOn=true;
  if(!o)continue;[o.root,o.extra].forEach(x=>{if(x)x.style.display=on?'block':'none'});
  if(on){o.set(t-it.t0);any=true}}
 // split frame
 const sp=!!(split&&!endOn);show(SPL.line,sp&&split.layout==='split');show(SPL.sw,sp);if(sp)SPL.sw.style.height=(split.layout==='full'?1920:864)+'px';
 if(sp){const lt=t-split.t0;const sw=SPL.sw.firstChild;sw.style.left=(-400+ease(lt/.45)*1700)+'px';sw.style.opacity=lt<.5?1:0;
  SPL.line.style.transform=`scaleX(${ease(lt/.3)})`;
  if(split.type==='vid'&&split.chip){show(SPL.chip,true);SPL.chip.textContent=split.chip;const p=eb((lt-.25)/.35);SPL.chip.style.transform=`translateX(${(1-p)*-60}px)`;SPL.chip.style.opacity=cl((lt-.25)/.15)}else show(SPL.chip,false)}
 else show(SPL.chip,false);
 // brand (hidden on end card)
 const bra=TL.items.find(x=>x.type==='brand');const bon=bra&&t>=bra.t0&&t<bra.t1;const ctaOn=TL.items.some(x=>x.type==='cta'&&t>=x.t0&&t<x.t1);show(BRAND.tb,bon);show(BRAND.lt,bon&&!(split&&split.type==='poster')&&!ctaOn);
 if(bon){const p=eb((t-.15)/.5);BRAND.tb.style.transform=`translateX(${(1-p)*300}px)`;BRAND.tb.querySelector('b').style.transform=`rotate(${t*60}deg) scale(${1+.25*Math.sin(t*4)})`;
  BRAND.lt.style.clipPath=`inset(0 ${100-100*ease((t-.3)/.6)}% 0 0)`;any=true}
 // captions
 let ci=-1;for(let i=0;i<TL.captions.length;i++){const c=TL.captions[i];if(t>=c.t0&&t<c.t1){ci=i;break}}
 if(ci<0||endOn){show(CAPEL,false)}else{const c=TL.captions[ci];show(CAPEL,true);CAPEL.style.display='flex';any=true;
  const lead=CAPEL.children[0],kw=CAPEL.children[1];
  if(ci!==lastCap){CAPEL.className=(c.pos==='split'?'split':'')+(TL.capStyle==='B'?' B':'');lead.innerHTML=c.lead?`<i>${STAR}</i>${c.lead}<i>${STAR}</i>`:'';lead.style.display=c.lead?'flex':'none';kw.textContent=c.kw;
   fitKw(kw,TL.capStyle==='B'?(c.pos==='split'?84:98):(c.pos==='split'?96:118),1000);lastCap=ci}
  const lt=t-c.t0,dur=c.t1-c.t0,out=cl((dur-lt)/.1);
  const p=eb(lt/.32);lead.style.opacity=cl(lt/.18)*out;lead.style.transform=`translateY(${(1-ease(lt/.25))*18}px)`;
  kw.style.opacity=cl((lt-.06)/.16)*out;kw.style.transform=`scale(${1.22-.22*p})`;kw.style.letterSpacing=(TL.capStyle==='B'?1:0)+(1-ease(lt/.35))*10+'px';
  kw.style.backgroundPosition=`${130-ease(lt/.9)*190}% 0, 0 0`}
 return any}
