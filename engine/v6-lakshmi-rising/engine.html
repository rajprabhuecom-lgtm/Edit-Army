const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3), eb=x=>{x=Math.max(0,Math.min(1,x));const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)}, cl=x=>Math.max(0,Math.min(1,x));
const R=document.getElementById('root'); let TL, ITEMS=[], CAPS=[], CAPEL, BRAND={}, SPL={};

function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}
function mandala(parent,cls){const n=24;let s=`<svg viewBox="-100 -100 200 200" class="${cls||'mand'}" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="#F5D488" stroke-width=".6">`;
 for(let i=0;i<n;i++)s+=`<ellipse cx="0" cy="-52" rx="9" ry="34" transform="rotate(${i*360/n})"/>`;
 for(let i=0;i<n;i++)s+=`<ellipse cx="0" cy="-78" rx="5" ry="16" transform="rotate(${i*360/n+7.5})"/>`;
 s+=`<circle r="20"/><circle r="26"/><circle r="94"/><circle r="97"/></g></svg>`;const d=el('div',null,s,parent);return d.firstChild}
function dust(parent,n,h){const a=[];for(let i=0;i<n;i++){const d=el('div','dust',null,parent);a.push(d)}return (t)=>a.forEach((d,i)=>{const x=rnd(i)*1080,y=(rnd(i+50)*h - t*(20+rnd(i+9)*40))%h;
 d.style.left=x+'px';d.style.top=(y<0?y+h:y)+'px';d.style.opacity=(0.25+0.75*Math.abs(Math.sin(t*1.8+i)))*0.8;const s=0.5+rnd(i+3)*1.1;d.style.transform=`scale(${s})`})}
function stage(full){const s=el('div','stage'+(full?' full':''));const m=mandala(s);const dz=dust(s,34,full?1920:864);return {s,m,dz}}
function show(e,v){e.style.display=v?'block':'none'}

 const you=el('div','card',`<span class="e">🌸</span><span class="x" style="font-family:PF;font-style:italic;font-weight:900;font-size:50px;color:#FFD9E5">And You?</span><span class="tick" style="background:none;border:3px dashed #E86A92;color:#E86A92">?</span>`,st.s);

/* ================= engine ================= */
function init(tl){TL=tl;
 for(const it of tl.items){let o=null;
  if(it.type==='vid'){o=null}
  else if(SC[it.type]){o=SC[it.type](it)}
  else if(GF[it.type]){o=GF[it.type](it)}
  if(o){[o.root,o.extra].forEach(x=>{if(x){x.style.display='none';if(!x.classList.contains('L')&&!x.classList.contains('stage')){}}})}
  ITEMS.push({it,o})}
 // split frame pieces
 SPL.line=el('div',null,null);SPL.line.id='sline';SPL.sw=el('div',null,'<div></div>');SPL.sw.id='sweep';SPL.chip=el('div',null,'');SPL.chip.id='chip';
 // brand
 BRAND.tb=el('div',null,'<span class="gold">Lakshmi Rising</span><b>✦</b>');BRAND.tb.id='tb';
 BRAND.lt=el('div',null,'<div class="n gold">Jayachitra</div><div class="t">MONEY & CAREER MANIFESTATION COACH FOR WORKING WOMEN</div>');BRAND.lt.id='lt';
 CAPEL=el('div',null,'<div class="lead"></div><div class="kw"></div>');CAPEL.id='cap';
 for(const x of [SPL.line,SPL.sw,SPL.chip,BRAND.tb,BRAND.lt,CAPEL])x.style.display='none';
 const ec=ITEMS.find(x=>x.it.type==='endcard');if(ec)R.appendChild(ec.o.root);
 return true}
let lastCap=-1;
function fitKw(kw,max,maxw){let s=max;kw.style.fontSize=s+'px';while(kw.scrollWidth>maxw&&s>48){s-=4;kw.style.fontSize=s+'px'}}
function setT(t){let any=false,split=null,endOn=false;
 for(const {it,o} of ITEMS){const on=t>=it.t0&&t<it.t1;
  if(it.layout&&on)split=it;
  if(it.type==='endcard'&&on)endOn=true;
  if(!o)continue;[o.root,o.extra].forEach(x=>{if(x)x.style.display=on?'block':'none'});
  if(on){o.set(t-it.t0);any=true}}
 // split frame
 const sp=!!(split&&!endOn);show(SPL.line,sp);show(SPL.sw,sp);
 if(sp){const lt=t-split.t0;const sw=SPL.sw.firstChild;sw.style.left=(-400+ease(lt/.45)*1700)+'px';sw.style.opacity=lt<.5?1:0;
  SPL.line.style.transform=`scaleX(${ease(lt/.3)})`;
  if(split.type==='vid'&&split.chip){show(SPL.chip,true);SPL.chip.textContent=split.chip;const p=eb((lt-.25)/.35);SPL.chip.style.transform=`translateX(${(1-p)*-60}px)`;SPL.chip.style.opacity=cl((lt-.25)/.15)}else show(SPL.chip,false)}
 else show(SPL.chip,false);
 // brand (hidden on end card)
 const bra=TL.items.find(x=>x.type==='brand');const bon=bra&&t>=bra.t0&&t<bra.t1;show(BRAND.tb,bon);show(BRAND.lt,bon&&!(split&&split.type==='poster'));
 if(bon){const p=eb((t-.15)/.5);BRAND.tb.style.transform=`translateX(${(1-p)*300}px)`;BRAND.tb.querySelector('b').style.transform=`rotate(${t*60}deg) scale(${1+.25*Math.sin(t*4)})`;
  BRAND.lt.style.clipPath=`inset(0 ${100-100*ease((t-.3)/.6)}% 0 0)`;any=true}
 // captions
 let ci=-1;for(let i=0;i<TL.captions.length;i++){const c=TL.captions[i];if(t>=c.t0&&t<c.t1){ci=i;break}}
 if(ci<0||endOn){show(CAPEL,false)}else{const c=TL.captions[ci];show(CAPEL,true);CAPEL.style.display='flex';any=true;
  const lead=CAPEL.children[0],kw=CAPEL.children[1];
  if(ci!==lastCap){CAPEL.className=(c.pos==='split'?'split':'')+(TL.capStyle==='B'?' B':'');lead.innerHTML=c.lead?`<i>✦</i>${c.lead}<i>✦</i>`:'';lead.style.display=c.lead?'flex':'none';kw.textContent=c.kw;
   fitKw(kw,TL.capStyle==='B'?(c.pos==='split'?84:98):(c.pos==='split'?96:118),1000);lastCap=ci}
  const lt=t-c.t0,dur=c.t1-c.t0,out=cl((dur-lt)/.1);
  const p=eb(lt/.32);lead.style.opacity=cl(lt/.18)*out;lead.style.transform=`translateY(${(1-ease(lt/.25))*18}px)`;
  kw.style.opacity=cl((lt-.06)/.16)*out;kw.style.transform=`scale(${1.22-.22*p})`;kw.style.letterSpacing=(TL.capStyle==='B'?1:0)+(1-ease(lt/.35))*10+'px';
  kw.style.backgroundPosition=`${130-ease(lt/.9)*190}% 0, 0 0`}
 return any}
