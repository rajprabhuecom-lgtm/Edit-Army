<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:M;font-weight:900;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-900-normal.woff2)}
@font-face{font-family:M;font-weight:800;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2)}
@font-face{font-family:M;font-weight:700;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-700-normal.woff2)}
@font-face{font-family:T;font-weight:900;src:url(node_modules/@fontsource/noto-sans-tamil/files/noto-sans-tamil-tamil-900-normal.woff2)}
@font-face{font-family:A;src:url(node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2)}
:root{--em:#00C896;--yl:#FFD60A;--rd:#FF3B30;--ob:#080A0D;--ti:#8B949E;--pl:#D8DDE3;--wa:#25D366}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;background:transparent;overflow:hidden}
body{font-family:M,'Noto Color Emoji',T,sans-serif;color:#fff}
.layer{position:absolute;inset:0;display:none}
.stroke{paint-order:stroke fill;-webkit-text-stroke:16px #000;text-shadow:0 10px 24px rgba(0,0,0,.55)}
.s10{paint-order:stroke fill;-webkit-text-stroke:10px #000}
#cap{position:absolute;left:50px;right:50px;top:1175px;height:300px;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:0 24px;text-align:center;z-index:10}
#cap span{display:inline-block;font-weight:900;font-size:86px;line-height:1.08;text-transform:uppercase;transform-origin:50% 70%}
#cap.split{top:668px;height:190px}
#cap.hi{top:235px;height:230px}
.stage{position:absolute;left:0;top:0;width:1080px;overflow:hidden;background:radial-gradient(120% 90% at 50% 30%,#13241e 0%,#0b1411 50%,#080A0D 100%)}
.stage.full{height:1920px}.stage.split{height:864px;border-bottom:8px solid var(--em);box-shadow:0 10px 40px rgba(0,0,0,.6)}
.inner{position:absolute;inset:0;transform-origin:540px 420px}
.grid{position:absolute;inset:-200px;background-image:linear-gradient(rgba(0,200,150,.07) 2px,transparent 2px),linear-gradient(90deg,rgba(0,200,150,.07) 2px,transparent 2px);background-size:90px 90px}
.glow{position:absolute;width:900px;height:900px;border-radius:50%;left:90px;top:-100px;background:radial-gradient(circle,rgba(0,200,150,.16),transparent 65%)}
.ttl{position:absolute;left:0;right:0;text-align:center;font-weight:900;text-transform:uppercase;line-height:1.04;z-index:4}
.card{position:absolute;background:#0f1713;border:4px solid rgba(0,200,150,.6);border-radius:34px;box-shadow:0 0 60px rgba(0,200,150,.18),0 30px 60px rgba(0,0,0,.5)}
.chip{white-space:nowrap;display:inline-block;padding:10px 28px;border-radius:999px;font-weight:900;font-size:40px}
.g{color:var(--em)}.y{color:var(--yl)}.r{color:var(--rd)}
svg{overflow:visible}
.flash{position:absolute;inset:0;background:#fff;pointer-events:none;z-index:20}
</style></head><body>
<div id="root"></div>
<div id="cap" class="stroke"></div>
<script>
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const easeIO=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=clamp(x);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const pop=(dt,d=.28)=>back(dt/d);
const lerp=(a,b,p)=>a+(b-a)*p;
const root=document.getElementById('root');let TL=null;const els=[];
function mk(html){const d=document.createElement('div');d.className='layer';d.innerHTML=html;root.appendChild(d);return d}
const q=(el,s)=>el.querySelector(s), qa=(el,s)=>[...el.querySelectorAll(s)];
function stage(it,inner){return `<div class="stage ${it.layout||'full'}"><div class="inner"><div class="grid"></div><div class="glow"></div>${inner}</div><div class="flash"></div></div>`}
function popIn(x,dt,d=.32){if(!x)return;x.style.opacity=clamp(dt/.06);x.style.transform=`scale(${dt<0?0:pop(dt,d)})`}
function slideUp(x,dt,dist=500,d=.4){x.style.opacity=clamp(dt/.08);x.style.transform=`translateY(${(1-ease(dt/d))*dist}px)`}
const S={};
const SP=it=>it.layout=='split';

/* phone shell */
const PHONE=(w,h,head,body)=>`<div class="phone card" style="width:${w}px;height:${h}px;border-radius:46px;border:8px solid #D8DDE3;background:#0b141a;overflow:hidden">
 <div style="height:86px;background:#1f2c34;display:flex;align-items:center;padding-left:26px;font-size:30px;font-weight:800;gap:14px"><div style="width:52px;height:52px;border-radius:50%;background:var(--wa);display:flex;align-items:center;justify-content:center;font-size:30px">${head[0]}</div>${head[1]}</div>
 <div class="body" style="display:flex;flex-direction:column;padding:14px 18px">${body}</div></div>`;
const BUB=(dir,txt,extra='')=>`<div class="msg" style="align-self:${dir=='in'?'flex-start':'flex-end'};max-width:86%;margin:9px 0;padding:14px 22px;border-radius:24px;font-size:35px;font-weight:700;line-height:1.25;background:${dir=='in'?'#202c33':'#005c4b'};color:#e9edef;${extra}">${txt}</div>`;

/* 1. client request on WhatsApp */
S.clientmsg=(it)=>{const el=mk(stage(it,`<div class="ttl stroke t1" style="top:34px;font-size:84px">CLIENT'S <span class="y">REQUEST</span></div>
 <div class="ph" style="position:absolute;left:190px;top:160px">${PHONE(700,470,['👤','Important Client'],
  BUB('in','I don\'t want <b style="color:#FF6B60">JUNK LEADS</b> ❌')+BUB('in','Give me only <b style="color:#3dffc8">QUALITY LEADS</b> ✅')+`<div class="typ" style="align-self:flex-start;margin-top:8px;padding:14px 22px;border-radius:24px;background:#202c33;font-size:40px;letter-spacing:6px">•••</div>`)}</div>`));
 return {el,upd(dt){popIn(q(el,'.t1'),dt);slideUp(q(el,'.ph'),dt-.05,600);
  qa(el,'.msg').forEach((m,i)=>{const t=dt-.45-i*.8;m.style.opacity=clamp(t/.06);m.style.transform=`scale(${t<0?0:pop(t,.3)})`;m.style.transformOrigin='left bottom'});
  const ty=q(el,'.typ');ty.style.opacity=dt>2.3?.4+.6*Math.abs(Math.sin(dt*5)):0}}};

/* 2. ads bring quality + junk */
S.leadrain=(it)=>{let d='';for(let i=0;i<16;i++){const good=[0,2,3,6,9,11,14].includes(i);
  d+=`<div class="ld" data-g="${good?1:0}" style="position:absolute;left:0;top:0;width:120px;height:120px;border-radius:30px;background:${good?'#0f2a20':'#2a1010'};border:5px solid ${good?'#00C896':'#FF3B30'};display:flex;align-items:center;justify-content:center;font-size:62px;font-weight:900;color:${good?'#00C896':'#FF3B30'}">${good?'✓':'✕'}</div>`}
 const el=mk(stage(it,`<div class="ttl stroke t1" style="top:250px;font-size:104px">RUN <span class="y">ADS</span> =</div>
  <div class="ttl stroke t2" style="top:370px;font-size:92px"><span class="g">QUALITY</span> + <span class="r">JUNK</span></div>
  <div class="mg" style="position:absolute;left:390px;top:500px;width:300px;height:170px;border-radius:30px;background:var(--yl);color:#000;display:flex;align-items:center;justify-content:center;font-size:70px;font-weight:900;box-shadow:0 20px 50px rgba(0,0,0,.5)">📢 AD</div>
  <div class="box" style="position:absolute;left:140px;top:700px;width:800px;height:440px">${d}</div>
  <div class="cnt" style="position:absolute;left:0;right:0;top:1520px;text-align:center;font-weight:900;font-size:56px">
   <span class="chip" style="background:#0f2a20;border:4px solid var(--em);color:var(--em);font-size:52px">✓ QUALITY <span class="nq">0</span></span>&nbsp;
   <span class="chip" style="background:#2a1010;border:4px solid var(--rd);color:var(--rd);font-size:52px">✕ JUNK <span class="nj">0</span></span></div>`));
 return {el,upd(dt){popIn(q(el,'.t1'),dt);popIn(q(el,'.t2'),dt-.35);
  const mg=q(el,'.mg');mg.style.transform=`scale(${pop(dt-.1)*(1+.05*Math.sin(dt*14))}) rotate(${Math.sin(dt*9)*3}deg)`;
  let nq=0,nj=0;qa(el,'.ld').forEach((x,i)=>{const t=dt-.5-i*.13;const col=i%6,row=(i/6|0);const X=col*136,Y=row*140;
   const p=ease(t/.45);x.style.opacity=clamp(t/.05);x.style.left=lerp(330,X,p)+'px';x.style.top=lerp(-200,Y,p)+'px';x.style.transform=`rotate(${(1-p)*(i%2?40:-40)}deg) scale(${.5+.5*p})`;
   if(t>.45){if(x.dataset.g==1)nq++;else nj++}});
  q(el,'.nq').textContent=nq;q(el,'.nj').textContent=nj;popIn(q(el,'.cnt'),dt-.6)}}};

/* 3. everyone says: VSL / this / that -> struck out */
S.methods=(it)=>{const C=[['🎬','USE VSL'],['🧩','USE THIS'],['🛠️','USE THAT']];let c='';
 C.forEach((x,i)=>{c+=`<div class="card mc" style="left:120px;top:${540+i*210}px;width:840px;height:180px;display:flex;align-items:center;padding:0 40px;overflow:visible">
  <div style="font-size:96px;width:140px">${x[0]}</div><div class="lb" style="position:relative;font-weight:900;font-size:80px">${x[1]}<div class="sk" style="position:absolute;left:-10px;top:50%;height:14px;border-radius:7px;background:var(--rd);width:0"></div></div>
  <div class="x" style="position:absolute;right:-24px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--rd);font-size:72px;font-weight:900;display:flex;align-items:center;justify-content:center">✕</div></div>`});
 const el=mk(stage(it,`<div class="ttl stroke t1" style="top:260px;font-size:96px">EVERYONE SAYS…</div>${c}
  <div class="nb" style="position:absolute;left:0;right:0;top:1530px;text-align:center"><span class="chip" style="background:var(--yl);color:#000;font-size:56px">🤯 TOO MANY "METHODS"</span></div>`));
 return {el,upd(dt){popIn(q(el,'.t1'),dt);
  qa(el,'.mc').forEach((c,i)=>{const t=dt-.25-i*.4;c.style.opacity=clamp(t/.08);c.style.transform=`translateX(${(1-ease(t/.3))*(i%2?1100:-1100)}px)`;
   const tx=dt-1.7-i*.22;q(c,'.sk').style.width=(ease(tx/.2)*106)+'%';const x=q(c,'.x');x.style.opacity=clamp(tx/.06);x.style.transform=`scale(${tx<0?0:lerp(2.2,1,ease(tx/.16))}) rotate(-10deg)`;
   c.style.borderColor=tx>0?'#FF3B30':'rgba(0,200,150,.6)';q(c,'.lb').style.opacity=tx>0?.5:1});popIn(q(el,'.nb'),dt-2.4)}}};

/* 4. cost per enquiry must not increase (gauge + lock) */
S.cpl=(it)=>{const el=mk(stage(it,`<div class="ttl stroke t1" style="top:34px;font-size:80px">COST PER <span class="y">ENQUIRY</span></div>
  <svg style="position:absolute;left:240px;top:200px" width="600" height="360" viewBox="0 0 600 360">
   <path d="M60 320 A240 240 0 0 1 540 320" stroke="#1d2b26" stroke-width="54" fill="none"/>
   <path d="M60 320 A240 240 0 0 1 180 112" stroke="#00C896" stroke-width="54" fill="none"/>
   <path d="M180 112 A240 240 0 0 1 420 112" stroke="#FFD60A" stroke-width="54" fill="none"/>
   <path d="M420 112 A240 240 0 0 1 540 320" stroke="#FF3B30" stroke-width="54" fill="none"/>
   <g class="nd" style="transform-origin:300px 320px"><path d="M292 320 L300 110 L308 320 Z" fill="#fff"/><circle cx="300" cy="320" r="26" fill="#fff"/></g>
   <text x="300" y="250" text-anchor="middle" font-family="M" font-weight="900" font-size="38" fill="#00C896" class="lw">LOW</text></svg>
  <div class="lk" style="position:absolute;left:770px;top:330px;font-size:130px">🔒</div>
  <div class="nb" style="position:absolute;left:0;right:0;top:570px;text-align:center"><span class="chip s10" style="background:var(--rd);font-size:46px">MUST NOT INCREASE ↑</span></div>`));
 return {el,upd(dt){popIn(q(el,'.t1'),dt);
  let a=-60;const t=dt-.4;if(t>0)a=-60+Math.min(t,.7)/.7*95;if(t>.7)a=35-ease((t-.7)/.4)*95+Math.sin(t*30)*Math.exp(-(t-.7)*4)*6;
  q(el,'.nd').style.transform=`rotate(${a}deg)`;popIn(q(el,'.lk'),dt-1.1,.3);popIn(q(el,'.nb'),dt-1.3)}}};

/* 5. pipeline: ad -> whatsapp -> chat flow */
S.pipeline=(it)=>{const N=[['📢','ADS','#FFD60A'],['💬','WHATSAPP','#25D366'],['🤖','CHAT FLOW','#00C896']];let n='';
 N.forEach((x,i)=>{n+=`<div class="card nd" style="left:${40+i*350}px;top:250px;width:300px;height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-color:${x[2]};box-shadow:0 0 60px ${x[2]}44">
  <div style="font-size:130px;line-height:1">${x[0]}</div><div style="font-weight:900;font-size:40px;margin-top:16px">${x[1]}</div></div>`});
 let p='';for(let i=0;i<8;i++)p+=`<div class="pk" style="position:absolute;top:385px;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 0 20px #fff"></div>`;
 const el=mk(stage(it,`<div class="ttl stroke t1" style="top:40px;font-size:84px">THE <span class="g">SYSTEM</span></div>
  <div class="ln" style="position:absolute;left:190px;top:392px;height:16px;width:0;border-radius:8px;background:linear-gradient(90deg,#FFD60A,#25D366,#00C896)"></div>${n}${p}
  <div class="nb" style="position:absolute;left:0;right:0;top:580px;text-align:center"><span class="chip" style="background:var(--ob);border:4px solid var(--em);color:var(--em);font-size:42px">⚡ 100% AUTOMATED</span></div>`));
 return {el,upd(dt){popIn(q(el,'.t1'),dt);qa(el,'.nd').forEach((x,i)=>popIn(x,dt-.2-i*.9,.35));
  q(el,'.ln').style.width=(clamp((dt-.4)/1.9)*700)+'px';
  qa(el,'.pk').forEach((x,i)=>{const t=((dt-2.3)*.6+i/8)%1;x.style.left=(190+t*700-15)+'px';x.style.opacity=dt>2.3?Math.sin(Math.PI*t):0});
  popIn(q(el,'.nb'),dt-2.6)}}};

/* 6. qualify on whatsapp: questions + testimonial + brochure */
S.chatq=(it)=>{const body=BUB('out','🤖 What service do you need?')+BUB('in','Interior for 2BHK')+
  `<div class="msg" style="align-self:flex-end;display:flex;gap:14px;margin:9px 0">
   <div style="width:220px;height:130px;border-radius:18px;background:linear-gradient(150deg,#1d6b54,#0b1210);position:relative;border:3px solid #D8DDE3"><div style="position:absolute;left:80px;top:32px;width:60px;height:60px;border-radius:50%;background:#fff"><div style="position:absolute;left:23px;top:16px;border-left:22px solid #000;border-top:14px solid transparent;border-bottom:14px solid transparent"></div></div><div style="position:absolute;bottom:-2px;left:0;right:0;text-align:center;font-size:20px;font-weight:900;background:#FFD60A;color:#000;border-radius:0 0 14px 14px">TESTIMONIAL</div></div>
   <div style="width:220px;height:130px;border-radius:18px;background:#f4f6f8;color:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid #D8DDE3"><div style="font-size:54px">📄</div><div style="font-size:22px;font-weight:900">BROCHURE.pdf</div></div></div>`;
 const el=mk(stage(it,`<div class="ttl stroke t1" style="top:30px;font-size:78px"><span class="g">QUALIFY</span> ON WHATSAPP</div>
  <div class="ph" style="position:absolute;left:170px;top:140px">${PHONE(740,500,['🤖','Chat Flow • auto'],body)}</div>`));
 return {el,upd(dt){popIn(q(el,'.t1'),dt);slideUp(q(el,'.ph'),dt-.05,600);
  qa(el,'.msg').forEach((m,i)=>{const t=dt-.4-i*.75;m.style.opacity=clamp(t/.06);m.style.transform=`scale(${t<0?0:pop(t,.3)})`;m.style.transformOrigin=i==1?'left bottom':'right bottom'})}}};

/* 7. the filter: junk out, interested in */
S.filter=(it)=>{let d='';for(let i=0;i<14;i++){const good=[1,4,5,8,12].includes(i);
  d+=`<div class="ld" data-g="${good?1:0}" style="position:absolute;width:86px;height:86px;border-radius:50%;background:${good?'#00C896':'#FF3B30'};display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:900;color:#080A0D;box-shadow:0 10px 26px rgba(0,0,0,.5)">${good?'✓':'✕'}</div>`}
 const el=mk(stage(it,`<div class="ttl stroke t1" style="top:250px;font-size:110px"><span class="r">FILTER</span> OUT</div>
  <div class="ttl stroke t2" style="top:370px;font-size:80px">THE <span class="r">JUNK</span></div>
  <svg style="position:absolute;left:240px;top:560px" width="600" height="420" viewBox="0 0 600 420"><path d="M0 0 H600 L370 260 V420 H230 V260 Z" fill="rgba(0,200,150,.12)" stroke="#00C896" stroke-width="10" stroke-linejoin="round"/>
   <g stroke="#00C896" stroke-width="5" opacity=".6"><line x1="60" y1="60" x2="540" y2="60"/><line x1="120" y1="130" x2="480" y2="130"/><line x1="180" y1="200" x2="420" y2="200"/></g></svg>
  <div class="bin" style="position:absolute;left:860px;top:940px;font-size:120px">🗑️</div>
  <div class="ok" style="position:absolute;left:330px;top:1020px;width:420px;height:130px;border-radius:30px;background:#0f2a20;border:6px solid var(--em);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:50px;color:var(--em)">INTERESTED ✓ <span class="n" style="margin-left:14px;color:#fff">0</span></div>
  <div class="lds" style="position:absolute;inset:0">${d}</div>
  <div class="nb" style="position:absolute;left:0;right:0;top:1530px;text-align:center"><span class="chip" style="background:var(--em);color:#04110c;font-size:54px">ONLY SERIOUS BUYERS</span></div>`));
 return {el,upd(dt){popIn(q(el,'.t1'),dt);popIn(q(el,'.t2'),dt-.3);popIn(q(el,'.bin'),dt-.4);popIn(q(el,'.ok'),dt-.5);let n=0;
  qa(el,'.ld').forEach((x,i)=>{const t=dt-.6-i*.22;const g=x.dataset.g==1;const sx=280+(i*137)%520;let X,Y;
   if(t<.5){const p=ease(t/.5);X=lerp(sx,500,p*.7);Y=lerp(420,700,p)}
   else if(g){const p=easeIO((t-.5)/.45);X=lerp(lerp(sx,500,.7),497,p);Y=lerp(700,1040,p);if(p>=1){n++;X=497;Y=1040}}
   else{const p=clamp((t-.5)/.55);X=lerp(lerp(sx,500,.7),900,p);Y=700-Math.sin(p*Math.PI)*220+p*260}
   x.style.left=X+'px';x.style.top=Y+'px';x.style.opacity=t<0?0:(g&&t>.95?0:(!g&&t>1.05?0:1));x.style.transform=`scale(${t<0?0:pop(t,.25)}) rotate(${g?0:t*400}deg)`});
  q(el,'.n').textContent=n;const b=q(el,'.ok');if(n)b.style.boxShadow=`0 0 ${30+20*Math.sin(dt*10)}px rgba(0,200,150,.6)`;popIn(q(el,'.nb'),dt-2.6)}}};

/* 8. CRM monitor */
S.crm=(it)=>{const R=[['Ravi K.','✓ ANSWERED',1],['Priya S.','NO REPLY',0],['Arun M.','✓ ANSWERED',1],['Deepa R.','NO REPLY',0],['Karthik V.','✓ ANSWERED',1]];let r='';
 R.forEach((x,i)=>{r+=`<div class="rw" data-g="${x[2]}" style="position:absolute;left:30px;right:30px;top:${100+i*86}px;height:74px;border-radius:18px;background:#16201c;display:flex;align-items:center;padding:0 24px;font-size:34px;font-weight:800">
  <div style="width:46px;height:46px;border-radius:50%;background:#2b3a35;margin-right:20px"></div><div style="flex:1">${x[0]}</div>
  <div class="chip" style="font-size:26px;padding:8px 18px;background:${x[2]?'#00C896':'#3a4a44'};color:${x[2]?'#04110c':'#8B949E'}">${x[1]}</div></div>`});
 const el=mk(stage(it,`<div class="ttl stroke t1" style="top:30px;font-size:76px">TALK TO <span class="g">RIGHT ONES</span></div>
  <div class="card bd" style="left:110px;top:150px;width:860px;height:560px;overflow:hidden">
   <div style="height:80px;background:#0b1210;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-weight:900;font-size:32px"><span>📋 ENQUIRIES</span><span class="tg chip" style="font-size:26px;padding:8px 18px;background:#2b3a35">SHOW: ALL</span></div>${r}</div>`));
 return {el,upd(dt){popIn(q(el,'.t1'),dt);slideUp(q(el,'.bd'),dt,500);const f=dt>2.0;const tg=q(el,'.tg');tg.textContent=f?'SHOW: QUALIFIED ✓':'SHOW: ALL';tg.style.background=f?'#FFD60A':'#2b3a35';tg.style.color=f?'#000':'#fff';
  let k=0;qa(el,'.rw').forEach((x,i)=>{const t=dt-.3-i*.18;const g=x.dataset.g==1;let top=100+i*86;
   if(f){if(g){top=lerp(100+i*86,100+k*86,ease((dt-2)/.35));k++}else{x.style.opacity=1-ease((dt-2)/.25)}}
   if(!f||g)x.style.opacity=clamp(t/.1);x.style.top=top+'px';x.style.transform=`translateX(${(1-ease(t/.3))*-200}px)`})}}};

/* 9. auto booking calendar */

 return {el,upd(dt){q(el,'.e1').style.transform=`scale(${pop(dt,.4)})`;['.e2','.e3','.e4','.e5','.e6','.e7'].forEach((s,i)=>{const x=q(el,s);x.style.opacity=ease((dt-.1-i*.08)/.2);x.style.transform=`translateY(${(1-ease((dt-.1-i*.08)/.3))*120}px)`});
  const b=q(el,'.e5 .chip');const pl=(dt*1.4)%1;b.style.boxShadow=`0 0 0 ${pl*36}px rgba(0,200,150,${.5*(1-pl)})`;b.style.transform=`scale(${1+.04*Math.sin(dt*7)})`}}};


/* B12: post on your Instagram account -> posted -> hearts + reach */
S.igpost=(it)=>{let h='';for(let i=0;i<9;i++)h+=`<div class="ht" style="position:absolute;left:${470+(i%3)*40}px;top:520px;font-size:${48+(i%3)*10}px;opacity:0">❤️</div>`;
 const el=mk(stage(it,`<div class="ttl stroke t1" style="top:26px;font-size:76px">உங்க <span class="y">INSTAGRAM</span>-ல</div>
  <div class="ph" style="position:absolute;left:300px;top:130px;width:480px;height:500px;border-radius:44px;border:8px solid #D8DDE3;background:#000;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.6)">
   <div style="height:70px;display:flex;align-items:center;gap:14px;padding-left:20px;font-weight:800;font-size:26px"><div style="width:44px;height:44px;border-radius:50%;background:linear-gradient(45deg,#feda75,#d62976,#4f5bd5);padding:3px"><div style="width:100%;height:100%;border-radius:50%;background:#0f1713;display:flex;align-items:center;justify-content:center;font-size:22px">🏪</div></div>உங்க BUSINESS</div>
   <div class="im" style="position:relative;height:300px;background:linear-gradient(160deg,#1b3a30,#3a1b33);display:flex;align-items:center;justify-content:center;font-size:130px">🎬<div class="pl" style="position:absolute;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;font-size:56px;color:#000">▶</div></div>
   <div style="padding:14px 20px;font-size:44px;display:flex;gap:18px"><span class="hr">♡</span><span>💬</span><span>➤</span></div>
   <div class="pb" style="position:absolute;left:20px;right:20px;bottom:22px;height:44px;border-radius:22px;background:#1f2c34;overflow:hidden;font-weight:900;font-size:24px;display:flex;align-items:center;justify-content:center">
    <div class="pf" style="position:absolute;left:0;top:0;bottom:0;width:0;background:var(--em)"></div><span class="pt" style="position:relative;color:#fff">POSTING…</span></div></div>
  ${h}<div class="rc" style="position:absolute;left:792px;top:330px"><span class="chip" style="background:var(--yl);color:#000;font-size:38px;padding:10px 22px">🚀 REACH</span></div>
  <div class="ed" style="position:absolute;left:30px;top:330px"><span class="chip" style="background:var(--em);color:#04110c;font-size:44px">✂️ EDITED</span></div>`));
 const cu=it.cues||[.2,1.2,1.8];
 return {el,upd(dt){popIn(q(el,'.t1'),dt);slideUp(q(el,'.ph'),dt-cu[0]+.2,700);popIn(q(el,'.ed'),dt-cu[0]);
  const p=clamp((dt-cu[0])/(cu[1]-cu[0]));q(el,'.pf').style.width=(p*100)+'%';const done=dt>cu[1];q(el,'.pt').textContent=done?'POSTED ✓':'POSTING…';q(el,'.pt').style.color=done?'#04110c':'#fff';
  const hr=q(el,'.hr');hr.textContent=dt>cu[2]?'❤️':'♡';hr.style.display='inline-block';hr.style.transform=`scale(${dt>cu[2]?pop(dt-cu[2],.3):1})`;
  qa(el,'.ht').forEach((x,i)=>{const t=(dt-cu[2]-i*.13);if(t<0){x.style.opacity=0;return}const c=t%1.4;x.style.opacity=1-c/1.4;x.style.transform=`translate(${Math.sin(c*4+i)*40}px,${-c*380}px) scale(${.6+c*.5})`});
  popIn(q(el,'.rc'),dt-cu[2]-.25)}}};

/* B13: Theni map pin + 5 shops lighting up */
S.thenipin=(it)=>{const pos=[[170,260],[330,450],[540,500],[750,450],[910,260]];let c='';
 pos.forEach((p,i)=>c+=`<div class="sh" style="position:absolute;left:${p[0]-60}px;top:${p[1]-60}px;width:120px;height:120px;border-radius:30px;background:#0f1713;border:5px solid #2b3a35;display:flex;align-items:center;justify-content:center;font-size:70px">🏪<div class="tk" style="position:absolute;right:-14px;top:-14px;width:50px;height:50px;border-radius:50%;background:var(--em);color:#04110c;font-weight:900;font-size:32px;display:flex;align-items:center;justify-content:center">✓</div></div>`);
 let ln='';pos.forEach(p=>ln+=`<line class="ln" x1="540" y1="300" x2="${p[0]}" y2="${p[1]}" stroke="#00C896" stroke-width="6" stroke-dasharray="14 12"/>`);
 const el=mk(stage(it,`<div class="ttl stroke t1" style="top:26px;font-size:80px">📍 <span class="y">தேனி</span> • ONLY 5</div>
  <svg width="1080" height="864" style="position:absolute;left:0;top:0"><g stroke="#16251f" stroke-width="26"><line x1="0" y1="380" x2="1080" y2="330"/><line x1="380" y1="120" x2="420" y2="864"/><line x1="700" y1="120" x2="660" y2="864"/></g>${ln}</svg>
  <div class="rg" style="position:absolute;left:480px;top:300px;width:120px;height:44px;border-radius:50%;border:6px solid var(--rd)"></div>
  <div class="pn" style="position:absolute;left:480px;top:170px;font-size:130px;line-height:1">📍</div>${c}
  <div class="ft" style="position:absolute;left:0;right:0;top:575px;text-align:center"><span class="chip" style="background:var(--rd);font-size:44px">🔥 FIRST 5 BUSINESS OWNERS</span></div>`));
 const cu=it.cues||[.2,1.5,2.5];
 return {el,upd(dt){popIn(q(el,'.t1'),dt);const t=dt-cu[0];q(el,'.pn').style.transform=`translateY(${t<0?-500:(1-ease(t/.3))*-500}px)`;
  const rg=q(el,'.rg');const r=((dt-cu[0]-.3)%1.2)/1.2;rg.style.opacity=t>.3?1-r:0;rg.style.transform=`scale(${1+r*2})`;
  qa(el,'.sh').forEach((x,i)=>{const tt=dt-cu[1]-i*.22;x.style.opacity=clamp((tt+.4)/.1);x.style.transform=`scale(${tt+.4<0?0:pop(tt+.4,.3)})`;const on=tt>0;
   x.style.borderColor=on?'#00C896':'#2b3a35';x.style.background=on?'#0f2a20':'#0f1713';q(x,'.tk').style.transform=`scale(${on?pop(tt,.25):0})`});
  qa(el,'.ln').forEach((x,i)=>{const tt=dt-cu[1]-i*.22;x.style.opacity=tt>0?1:0;x.style.strokeDashoffset=-dt*40});popIn(q(el,'.ft'),dt-cu[2])}}};

/* on-face emoji sticker with burst */
S.sticker=(it)=>{let d='';for(let i=0;i<10;i++)d+=`<div class="bd" style="position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px;border-radius:50%;background:${['#FFD60A','#00C896','#FF3B30'][i%3]}"></div>`;
 const el=mk(`<div class="sk" style="position:absolute;left:${it.x||860}px;top:${it.y||900}px;width:0;height:0">${d}<div class="em" style="position:absolute;left:-${(it.size||150)/2}px;top:-${(it.size||150)/2}px;font-size:${it.size||150}px;line-height:1;filter:drop-shadow(0 12px 18px rgba(0,0,0,.55))">${it.e}</div></div>`);
 return {el,upd(dt){const e=q(el,'.em');e.style.transform=`scale(${pop(dt,.3)}) rotate(${(it.rot??-10)+Math.sin(dt*6)*8}deg) translateY(${-Math.max(0,dt-.4)*30}px)`;
  qa(el,'.bd').forEach((x,i)=>{const a=i/10*Math.PI*2,r=ease(dt/.5)*(it.size||150)*.95;x.style.transform=`translate(${Math.cos(a)*r}px,${Math.sin(a)*r}px) scale(${1-clamp(dt/.55)})`});
  el.style.opacity=clamp((it.t1-it.t0-dt)/.2)}}};

/* thin retention progress bar across the top */
S.progress=(it)=>{const el=mk(`<div style="position:absolute;left:0;top:0;width:1080px;height:14px;background:rgba(0,0,0,.35)"><div class="pg" style="height:100%;width:0;background:linear-gradient(90deg,#00C896,#FFD60A);box-shadow:0 0 18px rgba(255,214,10,.7)"></div></div>`);
 return {el,upd(dt){q(el,'.pg').style.width=(dt/(it.t1-it.t0)*100)+'%'}}};

/* ---------- captions ---------- */
const capEl=document.getElementById('cap');let curCap=null;
function drawCap(t){let c=null;for(const x of TL.captions){if(t>=x.t0&&t<x.t1){c=x;break}}
 if(!c||c.pos=='none'){capEl.style.display='none';curCap=null;return}
 capEl.style.display='flex';capEl.className='stroke'+(c.pos?' '+c.pos:'');
 if(curCap!==c){capEl.innerHTML=c.words.map(w=>`<span>${w}</span>`).join('');curCap=c}
 const sp=[...capEl.children];const n=sp.length;const dur=(c.t1-c.t0);
 sp.forEach((s,i)=>{const ws=c.t0+dur*i/n*0.8;const dt=t-ws;const vis=dt>=0;s.style.opacity=vis?1:0;const em=(c.hl||[]).includes(i);
  s.style.color=em?(c.col||'#00C896'):'#FFFFFF';const L=c.words.join(' ').length;const bs=(c.pos=='split'?.8:(c.pos=='hi'?.9:1))*(L>26?.78:(L>20?.88:1))*(/[\u0B80-\u0BFF]/.test(c.words.join(''))?.9:1);s.style.fontSize=(em?102:86)*bs+'px';
  s.style.transform=`scale(${vis?pop(dt,.22):0}) rotate(${em?-2:0}deg)`});}
const OVL=['text','cta','badge','flash','vid','price','stamp','strike','sticker'];
function init(tl){TL=tl;for(const it of TL.items){const b=S[it.type](it);b.el.style.zIndex=it.type=='progress'?40:it.type=='flash'?30:(it.type=='endcard'?5:(OVL.includes(it.type)?3:1));els.push([it,b])}}
function setT(t){let any=false,hideCap=false;
 for(const [it,b] of els){const on=t>=it.t0&&t<it.t1;b.el.style.display=on?'block':'none';
  if(on){any=true;const dt=t-it.t0;b.upd(dt,it,t);const inn=q(b.el,'.inner');
   if(inn){inn.style.transform=`scale(${1+.05*dt/(it.t1-it.t0)})`;q(b.el,'.grid').style.transform=`translateY(${(dt*30)%90}px)`;
    const fl=q(b.el,'.flash');fl.style.opacity=.5*(1-clamp(dt/.1));
    const out=clamp((it.t1-t)/.12);b.el.style.transform=`translateX(${(1-out)*-80}px)`}
   if(['text','cta','badge','price','stamp','strike'].includes(it.type))b.el.style.opacity=clamp((it.t1-t)/.12);
   if(it.nocap)hideCap=true}}
 drawCap(t);if(hideCap)capEl.style.display='none';return any||capEl.style.display!='none'}
window.init=init;window.setT=setT;
</script></body></html>
