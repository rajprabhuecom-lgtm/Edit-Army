<html><head><meta charset="utf-8">
<style>

<canvas id="c" width="1920" height="1080"></canvas>
<img id="face" src="face.png" style="display:none">
<script>
/* Tonight Wind-Down: calm night-ocean scene engine (v6-meditation).
   draw(t) renders one frame at video time t (seconds). Everything is deterministic. */
const W=1920,H=1080,HZ=640, c=document.getElementById('c'), x=c.getContext('2d');
let TL=null;
function rnd(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rnd(42);
const STARS=[...Array(320)].map(()=>({x:R()*W,y:Math.pow(R(),1.5)*(HZ-40),r:0.4+Math.pow(R(),3)*1.8,p:R()*6.28,s:0.2+R()*0.8}));
const FLIES=[...Array(34)].map(()=>({x:R()*W,y:300+R()*650,p:R()*6.28,s:0.3+R()*0.7,r:1.5+R()*2.5}));
const MIST=[...Array(6)].map((_,i)=>({x:R()*W,y:HZ-30+R()*90,w:500+R()*500,s:(R()-.5)*8}));
const SHIM=[...Array(140)].map(()=>({dy:Math.pow(R(),1.4),dx:(R()-.5),w:8+R()*46,p:R()*6.28,s:0.5+R()*1.5}));
const ease=v=>v<0?0:v>1?1:v*v*(3-2*v), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,k)=>a+(b-a)*k, mix3=(A,B,k)=>A.map((v,i)=>Math.round(lerp(v,B[i],k)));
const rgb=(a,al=1)=>`rgba(${a[0]},${a[1]},${a[2]},${al})`;
function fadeWin(t,a,b,fi=1,fo=1){return Math.min(ease((t-a)/fi),ease((b-t)/fo))}
// grain
const G=document.createElement('canvas');G.width=G.height=256;{const g=G.getContext('2d'),d=g.createImageData(256,256);const r=rnd(7);for(let i=0;i<d.data.length;i+=4){const v=r()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}g.putImageData(d,0,0)}
let GP=null;
function init(tl){TL=tl;GP=x.createPattern(G,'repeat')}
function night(t){return clamp((t-20)/(TL.voice_end-20),0,1)} // 0 = dusk-ish, 1 = deep night
function sky(t){
  const n=night(t);
  const top=mix3([10,14,38],[4,6,20],n), mid=mix3([22,30,72],[10,14,40],n), hor=mix3([58,62,110],[24,28,64],n);
  const g=x.createLinearGradient(0,0,0,HZ); g.addColorStop(0,rgb(top)); g.addColorStop(.62,rgb(mid)); g.addColorStop(1,rgb(hor));
  x.fillStyle=g; x.fillRect(0,0,W,HZ+2);
  // aurora ribbons
  x.globalCompositeOperation='lighter';
  const cols=[[40,170,150],[110,90,190],[60,130,200]];
  for(let k=0;k<3;k++){
    const yb=150+k*55, amp=40+k*12, al=(0.05-0.012*k)*(1-0.5*n);
    const gr=x.createLinearGradient(0,yb-120,0,yb+120); gr.addColorStop(0,rgb(cols[k],0)); gr.addColorStop(.5,rgb(cols[k],al)); gr.addColorStop(1,rgb(cols[k],0));
    x.fillStyle=gr; x.beginPath(); x.moveTo(0,yb+200);
    for(let px=0;px<=W;px+=40){x.lineTo(px,yb+Math.sin(px/430+t*0.05+k*1.7)*amp+Math.sin(px/190-t*0.035+k)*amp*0.35-80)}
    for(let px=W;px>=0;px-=40){x.lineTo(px,yb+Math.sin(px/430+t*0.05+k*1.7+0.6)*amp+Math.sin(px/170-t*0.03)*amp*0.4+90)}
    x.closePath(); x.fill();
  }
  // stars
  for(const s of STARS){const tw=0.55+0.45*Math.sin(t*s.s*0.9+s.p); const al=tw*(0.35+0.5*s.r/2.2)*(1-0.25*(s.y/HZ));
    x.fillStyle=`rgba(235,238,255,${al})`; x.beginPath(); x.arc(s.x+t*0.6*(s.y/HZ),s.y,s.r,0,6.283); x.fill();
    if(s.r>1.6){const g2=x.createRadialGradient(s.x+t*0.6*(s.y/HZ),s.y,0,s.x+t*0.6*(s.y/HZ),s.y,s.r*6);g2.addColorStop(0,`rgba(200,210,255,${al*0.25})`);g2.addColorStop(1,'rgba(200,210,255,0)');x.fillStyle=g2;x.beginPath();x.arc(s.x+t*0.6*(s.y/HZ),s.y,s.r*6,0,6.283);x.fill()}}
  x.globalCompositeOperation='source-over';
}
function moonPos(t){return [1480-t*0.08, 210+t*0.22]}
function moon(t){
  const [mx,my]=moonPos(t), r=62;
  x.globalCompositeOperation='lighter';
  let g=x.createRadialGradient(mx,my,r*0.8,mx,my,r*7); g.addColorStop(0,'rgba(255,236,200,0.22)'); g.addColorStop(.3,'rgba(220,210,255,0.07)'); g.addColorStop(1,'rgba(200,200,255,0)');
  x.fillStyle=g; x.beginPath(); x.arc(mx,my,r*7,0,6.283); x.fill();
  x.globalCompositeOperation='source-over';
  g=x.createRadialGradient(mx-r*0.3,my-r*0.3,r*0.1,mx,my,r); g.addColorStop(0,'#fff8ea'); g.addColorStop(.75,'#f1e4cc'); g.addColorStop(1,'#d9c9b0');
  x.fillStyle=g; x.beginPath(); x.arc(mx,my,r,0,6.283); x.fill();
  x.fillStyle='rgba(170,150,130,0.16)';
  for(const [a,b,cr] of [[-.3,-.1,.18],[.25,.2,.14],[.05,-.42,.09],[-.15,.38,.11],[.4,-.25,.07]]){x.beginPath();x.arc(mx+a*r,my+b*r,cr*r,0,6.283);x.fill()}
}
function hills(t){
  const n=night(t);
  const layers=[[mix3([30,34,74],[14,16,40],n),HZ-70,0.0021,90,0.3],[mix3([20,24,56],[9,11,30],n),HZ-30,0.0033,60,0.7]];
  for(const [col,base,f,amp,ph] of layers){
    x.fillStyle=rgb(col); x.beginPath(); x.moveTo(0,HZ+2);
    for(let px=0;px<=W;px+=16){
      const edge=Math.pow(Math.abs(px-W*0.47)/(W*0.53),1.6); // lower in the middle, open sea view
      x.lineTo(px,base+ (1-edge)*amp*1.1 - Math.sin(px*f+ph)*amp*0.5*edge - Math.sin(px*f*3.1+ph*2)*amp*0.15*edge + 30 - edge*amp*0.6);
    }
    x.lineTo(W,HZ+2); x.closePath(); x.fill();
  }
}
function sea(t){
  const n=night(t);
  const g=x.createLinearGradient(0,HZ,0,H); g.addColorStop(0,rgb(mix3([40,48,96],[18,22,52],n))); g.addColorStop(1,rgb(mix3([6,10,26],[2,4,12],n)));
  x.fillStyle=g; x.fillRect(0,HZ,W,H-HZ);
  // wave layers, far -> near
  for(let k=0;k<7;k++){
    const d=k/6, base=HZ+12+Math.pow(d,1.7)*(H-HZ-20), amp=2+d*24, sp=0.18+d*0.25, wl=120+d*260;
    const col=mix3(mix3([46,56,108],[20,26,60],n),mix3([4,8,22],[1,3,10],n),d);
    x.fillStyle=rgb(col,0.55+0.4*d); x.beginPath(); x.moveTo(0,H);
    for(let px=0;px<=W+20;px+=20){x.lineTo(px,base+Math.sin(px/wl+t*sp+k*1.3)*amp+Math.sin(px/(wl*0.43)-t*sp*1.3+k)*amp*0.35)}
    x.lineTo(W,H); x.closePath(); x.fill();
    // soft crest highlight
    x.strokeStyle=`rgba(190,200,255,${0.05+0.05*(1-d)})`; x.lineWidth=1+d*1.5; x.beginPath();
    for(let px=0;px<=W+20;px+=20){const yy=base+Math.sin(px/wl+t*sp+k*1.3)*amp+Math.sin(px/(wl*0.43)-t*sp*1.3+k)*amp*0.35; px?x.lineTo(px,yy):x.moveTo(px,yy)}
    x.stroke();
  }
  // moon reflection
  const [mx]=moonPos(t);
  x.globalCompositeOperation='lighter';
  const rg=x.createLinearGradient(0,HZ,0,H); rg.addColorStop(0,'rgba(255,230,190,0.10)'); rg.addColorStop(1,'rgba(255,230,190,0.0)');
  for(let k=0;k<10;k++){const yy=HZ+k*(H-HZ)/10, sp=60+k*30; const gg=x.createRadialGradient(mx,yy+22,0,mx,yy+22,sp); gg.addColorStop(0,`rgba(255,230,190,${0.06*(1-k/11)})`); gg.addColorStop(1,'rgba(255,230,190,0)'); x.fillStyle=gg; x.save(); x.translate(mx,yy+22); x.scale(1,0.35); x.translate(-mx,-(yy+22)); x.beginPath(); x.arc(mx,yy+22,sp,0,6.283); x.fill(); x.restore()}
  for(const s of SHIM){const yy=HZ+6+s.dy*(H-HZ-10), spread=40+s.dy*300; const al=Math.max(0,Math.sin(t*s.s+s.p))*0.45*(1-s.dy*0.6);
    x.fillStyle=`rgba(255,238,205,${al})`; const ww=s.w*(0.4+s.dy); x.fillRect(mx+s.dx*spread*2-ww/2+Math.sin(t*0.4+s.p)*6,yy,ww,1.2+s.dy*2.2)}
  x.globalCompositeOperation='source-over';
}
function mist(t){
  for(const m of MIST){const mx=((m.x+t*m.s)%(W+m.w*2)+W+m.w*2)%(W+m.w*2)-m.w;
    const g=x.createRadialGradient(mx,m.y,0,mx,m.y,m.w); g.addColorStop(0,'rgba(150,160,210,0.07)'); g.addColorStop(1,'rgba(150,160,210,0)');
    x.fillStyle=g; x.fillRect(mx-m.w,m.y-m.w,m.w*2,m.w*2)}
}
function flies(t,al){
  x.globalCompositeOperation='lighter';
  for(const f of FLIES){const px=(f.x+Math.sin(t*0.07*f.s+f.p)*90+t*3*f.s)%W, py=f.y+Math.sin(t*0.11*f.s+f.p*2)*60-((t*4*f.s)%200);
    const a=al*(0.35+0.35*Math.sin(t*0.6*f.s+f.p)); if(a<=0.01)continue;
    const g=x.createRadialGradient(px,py,0,px,py,f.r*7); g.addColorStop(0,`rgba(255,220,160,${a})`); g.addColorStop(.25,`rgba(255,200,130,${a*0.35})`); g.addColorStop(1,'rgba(255,200,130,0)');
    x.fillStyle=g; x.beginPath(); x.arc(px,py,f.r*7,0,6.283); x.fill()}
  x.globalCompositeOperation='source-over';
}
// --- guides
function breathState(t){ // returns {v:0..1 expansion, label, vis}
  const B=TL.breath; let v=0,label='',vis=0;
  const first=B[0][0], last=B[6][1];
  vis=fadeWin(t,first-1,last+5,3,4) + fadeWin(t,B[7][0]-1.5,B[8][1]+3,1.5,2.5);
  for(let i=0;i<B.length;i++){const [a,b,k]=B[i];
    if(t>=a&&t<b){const p=(t-a)/(b-a); if(k==='in'){v=ease(p);label='breathe in'} else if(k==='out'){v=1-ease(p);label='breathe out'} else {v=0;label=''} ;return {v,label,vis:Math.min(1,vis),lp:Math.min(ease(p*4),ease((1-p)*4))}}
    if(i+1<B.length&&t>=b&&t<B[i+1][0]){v=(k==='in')?1:0;return {v,label:'',vis:Math.min(1,vis),lp:0}}}
  return {v:0,label:'',vis:Math.min(1,vis),lp:0};
}
function breath(t){
  const s=breathState(t); if(s.vis<=0.005)return;
  const cx=W/2, cy=400, r=70+s.v*95;
  x.save(); x.globalAlpha=s.vis;
  x.globalCompositeOperation='lighter';
  let g=x.createRadialGradient(cx,cy,r*0.2,cx,cy,r*1.9); g.addColorStop(0,'rgba(120,200,210,0.10)'); g.addColorStop(.55,'rgba(120,180,230,0.07)'); g.addColorStop(1,'rgba(120,180,230,0)');
  x.fillStyle=g; x.beginPath(); x.arc(cx,cy,r*1.9,0,6.283); x.fill();
  x.globalCompositeOperation='source-over';
  x.strokeStyle='rgba(225,235,255,0.42)'; x.lineWidth=2; x.beginPath(); x.arc(cx,cy,r,0,6.283); x.stroke();
  x.strokeStyle='rgba(225,235,255,0.14)'; x.lineWidth=1; x.beginPath(); x.arc(cx,cy,165,0,6.283); x.stroke(); x.beginPath(); x.arc(cx,cy,70,0,6.283); x.stroke();
  if(s.label){x.globalAlpha=s.vis*s.lp*0.8; x.fillStyle='#eef0ff'; x.font='italic 500 40px Corm'; x.textAlign='center'; x.textBaseline='middle'; x.fillText(s.label,cx,cy)}
  x.restore();
}
function scan(t){ // body-softening: a soft warm band of light drifts slowly from head (top) to feet (bottom)
  const a=TL.sections[3][0]+10, b=TL.sections[4][0]+2; const vis=fadeWin(t,a,b,6,6); if(vis<=0)return;
  const p=clamp((t-a)/(b-a),0,1), y=lerp(-120,H+60,p);
  const g=x.createLinearGradient(0,y-220,0,y+220); g.addColorStop(0,'rgba(255,210,170,0)'); g.addColorStop(.5,`rgba(255,210,170,${0.055*vis})`); g.addColorStop(1,'rgba(255,210,170,0)');
  x.globalCompositeOperation='lighter'; x.fillStyle=g; x.fillRect(0,y-220,W,440); x.globalCompositeOperation='source-over';
}
function lantern(t){ // letting go: a small lantern set down on the water drifts to the horizon
  const [a,b]=TL.lantern; const vis=fadeWin(t,a,b+8,3,7); if(vis<=0)return;
  const p=ease(clamp((t-a)/(b+8-a),0,1)), sc=lerp(1,0.25,p);
  const lx=lerp(820,1060,p)+Math.sin(t*0.5)*8, ly=lerp(880,HZ+14,Math.pow(p,0.8))+Math.sin(t*0.9)*3*sc;
  x.save(); x.globalAlpha=vis;
  x.globalCompositeOperation='lighter';
  let g=x.createRadialGradient(lx,ly-24*sc,0,lx,ly-24*sc,150*sc); g.addColorStop(0,'rgba(255,190,110,0.45)'); g.addColorStop(.3,'rgba(255,170,90,0.12)'); g.addColorStop(1,'rgba(255,170,90,0)');
  x.fillStyle=g; x.beginPath(); x.arc(lx,ly-24*sc,150*sc,0,6.283); x.fill();
  // reflection
  g=x.createLinearGradient(0,ly,0,ly+90*sc); g.addColorStop(0,'rgba(255,190,120,0.28)'); g.addColorStop(1,'rgba(255,190,120,0)');
  x.fillStyle=g; x.fillRect(lx-14*sc,ly,28*sc,90*sc);
  x.globalCompositeOperation='source-over';
  // body
  x.fillStyle='rgba(255,214,150,0.95)'; x.beginPath(); x.moveTo(lx-16*sc,ly-6*sc); x.lineTo(lx+16*sc,ly-6*sc); x.lineTo(lx+11*sc,ly-46*sc); x.lineTo(lx-11*sc,ly-46*sc); x.closePath(); x.fill();
  x.fillStyle='rgba(255,246,220,0.95)'; x.beginPath(); x.ellipse(lx,ly-24*sc,5*sc,10*sc,0,0,6.283); x.fill();
  x.fillStyle='rgba(60,40,30,0.9)'; x.fillRect(lx-18*sc,ly-8*sc,36*sc,5*sc); x.fillRect(lx-13*sc,ly-50*sc,26*sc,4*sc);
  x.restore();
}
// --- text
function wrap(txt,maxW){const ws=txt.split(' ');const lines=[];let cur='';for(const w of ws){const tr=cur?cur+' '+w:w; if(x.measureText(tr).width>maxW&&cur){lines.push(cur);cur=w}else cur=tr}if(cur)lines.push(cur);return lines}
function captions(t){
  const C=TL.cues;
  for(let i=0;i<C.length;i++){const [a,b,txt]=C[i]; const nx=C[i+1]?C[i+1][0]:1e9; const end=Math.min(b+1.6,nx-0.25);
    if(t<a-0.6||t>end+0.6)continue; const al=fadeWin(t,a-0.35,end,0.55,0.6); if(al<=0)continue;
    x.save(); x.font='500 54px Corm'; x.textAlign='center'; x.textBaseline='alphabetic';
    const lines=wrap(txt,1250), lh=64, y0=985-(lines.length-1)*lh;
    x.shadowColor='rgba(0,0,10,0.85)'; x.shadowBlur=18; x.fillStyle=`rgba(244,238,226,${0.9*al})`;
    lines.forEach((l,j)=>x.fillText(l,W/2,y0+j*lh)); x.restore()}
}
function spaced(txt,cx,y,sp){let w=0;for(const ch of txt)w+=x.measureText(ch).width+sp;w-=sp;let px=cx-w/2;x.textAlign='left';for(const ch of txt){x.fillText(ch,px,y);px+=x.measureText(ch).width+sp}return w}
function sectionLabel(t){
  const S=TL.sections; for(let i=1;i<S.length;i++){const a=S[i][0], b=S[i+1]?S[i+1][0]:TL.voice_end; const al=fadeWin(t,a+0.5,Math.min(a+11,b),2.5,3); if(al<=0)continue;
    x.save(); x.font='300 22px Mont'; x.fillStyle=`rgba(225,228,245,${0.55*al})`; x.textBaseline='middle';
    const w=spaced(S[i][1].toUpperCase(),W/2,78,7); x.fillStyle=`rgba(225,228,245,${0.3*al})`; x.fillRect(W/2-w/2-70,77,44,1); x.fillRect(W/2+w/2+26,77,44,1);
    x.font='italic 500 24px Corm'; x.textAlign='center'; x.fillStyle=`rgba(225,228,245,${0.4*al})`; x.fillText(`${i} of ${S.length-1}`,W/2,112); x.restore()}
}
function intro(t){
  const al=fadeWin(t,0.3,9.6,2.2,2.6); if(al<=0)return;
  x.save(); x.textBaseline='middle';
  x.font='500 22px Mont'; x.fillStyle=`rgba(240,205,140,${0.85*al})`; const w=spaced('LIVE WEBINAR BONUS',W/2,330,8);
  x.fillStyle=`rgba(240,205,140,${0.45*al})`; x.fillRect(W/2-w/2-90,329,60,1); x.fillRect(W/2+w/2+30,329,60,1);
  x.font='italic 500 112px Corm'; x.textAlign='center'; x.fillStyle=`rgba(250,244,232,${al})`; x.shadowColor='rgba(0,0,20,.6)'; x.shadowBlur=30; x.fillText('Tonight Wind-Down',W/2,430);
  x.shadowBlur=0; x.font='500 40px Corm'; x.fillStyle=`rgba(230,230,245,${0.85*al})`; x.fillText('A gentle relaxation practice with Naheed',W/2,520);
  x.font='300 21px Mont'; x.fillStyle=`rgba(220,222,240,${0.6*al})`; spaced('Find a comfortable place  ·  Lower your screen brightness  ·  Not while driving',W/2,590,1.5);
  x.restore();
}
function outro(t){
  const ve=TL.voice_end; const al=fadeWin(t,ve+1.0,TL.total-5,3.5,6); if(al<=0)return;
  x.save(); x.textAlign='center'; x.textBaseline='middle';
  x.font='italic 500 96px Corm'; x.fillStyle=`rgba(250,244,232,${0.9*al})`; x.shadowColor='rgba(0,0,20,.6)'; x.shadowBlur=30; x.fillText('Good night',W/2,420);
  x.shadowBlur=0; x.font='500 34px Corm'; x.fillStyle=`rgba(230,230,245,${0.7*al})`; x.fillText('You can come back to this any evening.',W/2,500);
  x.font='300 18px Mont'; x.fillStyle=`rgba(210,212,232,${0.5*al})`; spaced('General relaxation guidance; individual experiences vary. Please don’t listen while driving.',W/2,1010,1);
  x.restore();
}
function badge(t){
  const face=document.getElementById('face'); const al=fadeWin(t,1.0,TL.total-3,3,6)*lerp(0.95,0.7,night(t)); if(al<=0)return;
  const cx=118, cy=118, r=58;
  x.save(); x.globalAlpha=al;
  let g=x.createRadialGradient(cx,cy,r,cx,cy,r+28); g.addColorStop(0,'rgba(240,205,140,0.22)'); g.addColorStop(1,'rgba(240,205,140,0)');
  x.fillStyle=g; x.beginPath(); x.arc(cx,cy,r+28,0,6.283); x.fill();
  x.save(); x.beginPath(); x.arc(cx,cy,r,0,6.283); x.clip(); x.drawImage(face,cx-r,cy-r,r*2,r*2);
  g=x.createLinearGradient(0,cy-r,0,cy+r); g.addColorStop(0,'rgba(10,14,40,0)'); g.addColorStop(1,'rgba(10,14,40,0.25)'); x.fillStyle=g; x.fillRect(cx-r,cy-r,r*2,r*2); x.restore();
  x.strokeStyle='rgba(240,205,140,0.7)'; x.lineWidth=1.6; x.beginPath(); x.arc(cx,cy,r+1,0,6.283); x.stroke();
  x.textBaseline='middle'; x.textAlign='left';
  x.font='italic 500 40px Corm'; x.fillStyle='rgba(250,244,232,0.92)'; x.fillText('Naheed',cx+r+24,cy-14);
  x.font='300 15px Mont'; x.fillStyle='rgba(225,228,245,0.62)'; let px=cx+r+26; for(const ch of 'TONIGHT WIND-DOWN'){x.fillText(ch,px,cy+22);px+=x.measureText(ch).width+3.2}
  x.restore();
}
function draw(t){
  x.globalAlpha=1; x.globalCompositeOperation='source-over';
  sky(t); moon(t); hills(t); sea(t); mist(t); flies(t,1-0.4*night(t)); scan(t); lantern(t);
  // gentle global dimming as the practice deepens; fade to near-black at the very end
  const dim=lerp(0,0.32,night(t))+0.55*ease((t-(TL.total-14))/12);
  // vignette
  const v=x.createRadialGradient(W/2,H*0.48,H*0.35,W/2,H*0.5,H*1.05); v.addColorStop(0,'rgba(0,0,8,0)'); v.addColorStop(1,'rgba(0,0,8,0.55)');
  x.fillStyle=v; x.fillRect(0,0,W,H);
  x.fillStyle=`rgba(0,0,6,${dim})`; x.fillRect(0,0,W,H);
  breath(t); intro(t); sectionLabel(t); badge(t); captions(t); outro(t);
  const inA=ease(t/2.0); if(inA<1){x.fillStyle=`rgba(0,0,0,${1-inA})`;x.fillRect(0,0,W,H)}
  // grain (fights gradient banding)
  x.save(); x.globalAlpha=0.035; x.globalCompositeOperation='overlay'; const o=(Math.floor(t*30)*97)%256; x.translate(-o,-(o*3)%256); x.fillStyle=GP; x.fillRect(0,0,W+256,H+256); x.restore();
}
